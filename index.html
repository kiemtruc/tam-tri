<style>
:root{
  --bg:#1A1F1C;--sf:#242B27;--sf2:#2C3530;--ln:#37423C;
  --tx:#E8E3D8;--mu:#8E968F;--mu2:#5E675F;
  --brass:#C9A96E;--brass2:#E2C58C;--sage:#7FA08E;--sage2:#9BBBA8;--red:#B5726A;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font:17px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brass);text-decoration:none}
#app{max-width:600px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;padding:14px 16px 96px}
h1{font-size:22px;font-weight:600;margin:6px 0 14px;letter-spacing:.01em}
h2{font-size:17px;font-weight:600;margin:22px 0 8px;color:var(--brass2)}
p{margin:0 0 10px}
.mu{color:var(--mu)}.sm{font-size:14px}.xs{font-size:12.5px}
hr{border:0;border-top:1px solid var(--ln);margin:18px 0}

/* ---- tabs ---- */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:600px;margin:0 auto;display:flex;width:100%}
nav.tabs a{flex:1;text-align:center;padding:11px 2px 9px;color:var(--mu);font-size:12px;line-height:1.2}
nav.tabs a b{display:block;font-size:18px;font-weight:400;margin-bottom:3px}
nav.tabs a.on{color:var(--brass2)}

/* ---- home ---- */
.clock{font-size:52px;font-weight:300;letter-spacing:.02em;text-align:center;margin-top:10px;line-height:1}
.date{text-align:center;color:var(--mu);margin:6px 0 22px}
.bigwrap{display:flex;flex-direction:column;gap:14px}
.big{display:block;width:100%;padding:30px 20px;border-radius:18px;text-align:left;
  font-size:34px;font-weight:600;letter-spacing:.03em;position:relative;overflow:hidden}
.big small{display:block;font-size:14px;font-weight:400;letter-spacing:0;margin-top:6px;opacity:.85}
.big.dong{background:linear-gradient(160deg,#35524A,#243A33);color:var(--sage2)}
.big.mo{background:linear-gradient(160deg,#5A4A2B,#3E3320);color:var(--brass2)}
.big:active{transform:scale(.985)}
.saying{text-align:center;color:var(--mu);margin:24px 0 0;font-style:italic}
.saying b{color:var(--tx);font-weight:500;font-style:normal;display:block}
.today{margin-top:26px;border-top:1px solid var(--ln);padding-top:12px}
.today .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}
.today .row:last-child{border:0}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);margin-right:6px;vertical-align:middle}
.badge.dong{color:var(--sage2);border-color:#3E5A50}
.badge.mo{color:var(--brass2);border-color:#5A4A2B}

/* ---- breath ---- */
.breath{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:20;padding:20px}
.breath .kind{font-size:14px;letter-spacing:.2em;color:var(--mu);margin-bottom:4px}
.breath .time{font-size:22px;font-weight:300;color:var(--mu);margin-bottom:34px}
.breath .phase{font-size:22px;margin-bottom:34px;min-height:1.5em;color:var(--brass2)}
.ring{width:220px;height:220px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--ln);position:relative}
.core{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--brass2),var(--brass) 55%,#7A6236);
  box-shadow:0 0 60px rgba(201,169,110,.25);animation:breathe 11s ease-in-out 2 forwards}
.core.dong{background:radial-gradient(circle at 40% 35%,var(--sage2),var(--sage) 55%,#3D5A4C);box-shadow:0 0 60px rgba(127,160,142,.25)}
@keyframes breathe{0%{transform:scale(.55)}45%{transform:scale(1.55)}55%{transform:scale(1.55)}100%{transform:scale(.55)}}
.breath .count{margin-top:34px;font-size:15px;color:var(--mu)}
.breath .skip{margin-top:38px;color:var(--mu2);font-size:14px;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.core{animation:none;transform:scale(1)}}

/* ---- forms ---- */
.q{margin:0 0 24px}
.q .lab{font-size:15px;color:var(--mu);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-size:15px;color:var(--tx)}
.chip.on{background:var(--brass);color:#1A1F1C;border-color:var(--brass);font-weight:500}
.chip.ghost{border-style:dashed;color:var(--mu)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:16px 12px;border-radius:var(--r);background:var(--sf);border:1px solid var(--ln);text-align:left;font-size:16px;line-height:1.3}
.opt small{display:block;color:var(--mu);font-size:12.5px;margin-top:4px}
.opt.on{border-color:var(--brass);background:#33301F}
textarea,input[type=text]{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px;
  color:var(--tx);outline:none;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--brass)}
textarea{min-height:88px}
.btn{display:inline-block;padding:13px 20px;border-radius:var(--r);background:var(--brass);color:#1A1F1C;font-weight:600;font-size:16px}
.btn.w{width:100%;text-align:center}
.btn.q{background:var(--sf);color:var(--tx);border:1px solid var(--ln);font-weight:500}
.btn.danger{background:none;color:var(--red);border:1px solid var(--ln)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:9px 0;background:var(--sf);color:var(--mu);font-size:15px;border-right:1px solid var(--ln)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brass);color:#1A1F1C;font-weight:600}
.scorerow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.scorerow .t{font-size:15px}
.scorerow .t small{display:block;color:var(--mu);font-size:12.5px}
.seg.s4{width:150px}.seg.s3{width:114px}
.result{background:var(--sf2);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin:14px 0}

<script>
const BOOKS={"thay": "# KHÔNG GIAN TRONG ĐẦU\n\n## Cuốn THẤY\n\n*Bộ năm: **Thấy · Dùng · Chấm · Cảm · Thử***\n\n*Cuốn này đọc một mạch được. Cuốn **Dùng** là sổ tay, mở khi cần. Cuốn **Cảm** là truyện, không nhắc một chữ nào của hệ này. Cuốn **Thử** là bảy mươi ca chấm thử, để tập chấm bằng tay.*\n\n---\n\n## Chương 1 — Cái thang\n\nTrong đầu bạn lúc này đang có một thứ. Chỉ một thôi — dù cảm giác là đầy ắp.\n\nCái thứ đang ở đó, và cái được cho ở lại lâu, quyết định **cái thang của bạn dựng vào bức tường nào.**\n\nNgười ta bỏ cả đời để trèo. Trèo nhanh, trèo giỏi, trèo không nghỉ, dậy sớm hơn người khác. Rồi lên tới nơi mới biết mình dựng nhầm tường. Mà chọn nhầm tường thì không xảy ra lúc đang trèo — chuyện đó xong từ lâu rồi, xong ở dưới đất, xong trong đầu, vào những buổi chiều chẳng có gì đặc biệt, khi một ý nghĩ trồi lên và được cho ở lại.\n\nVà đây không phải cái thang chọn việc để làm, chọn vấn đề để giải, chọn lời để nói. Mấy cái đó đều là chọn giữa những thứ **đã có mặt** trong đầu bạn rồi. Cái thang này đứng sớm hơn một bậc, ở chỗ ít ai đặt chân tới:\n\n> **chọn thứ nào được có mặt.**\n\nNghe như chuyện không làm được — và đúng là không làm được theo cách trực tiếp. Không ai ra lệnh cho một ý nghĩ đừng trồi lên. Nhưng làm được theo cách gián tiếp: bạn không chọn được cái trồi lên, nhưng chọn được cái được ở lại. Không cấm được cửa, nhưng dọn được đường. Không ép được đầu mình nghĩ điều đáng, nhưng xếp được sao cho điều đáng là thứ gần tay nhất khi chỗ trống xuất hiện.\n\nCó bốn cuốn, và bốn cuốn không xếp thành bậc thang — cuốn nào vào trước cũng được.\n\nCuốn bạn đang cầm là cuốn **Thấy**: nó chỉ làm một việc, là cho bạn nhìn thấy cái vốn không nhìn thấy được. Chỗ ấy nhỏ tới đâu, cái gì đang chen vào, cái trồi lên có hình dạng gì, và hai cái thước để đo. Không có bước nào để làm theo.\n\nCuốn **Dùng** là sổ tay: chín ô, năm nhịp, từng bước, mở ra là chạy.\n\nCuốn **Chấm** là hai cái thước bằng điểm số — mở khi hai món ngang nhau mà phải chọn, hoặc khi ngờ mình đang tự bênh một món. Chưa cần nó vẫn chạy được hệ.\n\nCuốn **Cảm** là một truyện, mười một đoản văn về một người mất ngủ lên am ở ít bữa. Trong đó không có một chữ nào của hệ này.\n\nCuốn **Thử** là bảy mươi ca đã chấm, bày hết điểm từng câu, kèm những chỗ khung từng gãy và được sửa.\n\nCó người phải thấy trước mới chịu làm; có người dùng vài tuần rồi mới hiểu mình đang làm gì; có người chỉ cần đọc một câu chuyện; và có người phải xem số trước đã.\n\n---\n\n## Chương 2 — Một chỗ rất nhỏ, một hàng rất dài\n\nỞ một thời điểm, đầu bạn giữ được một thứ. Họa hoằn lắm là hai. Cái mà bạn gọi là đa nhiệm thật ra là chuyển qua chuyển lại rất nhanh, và mỗi lần chuyển lại rơi vãi một ít.\n\nVậy sao lúc nào cũng thấy đầy? Vì đằng sau cái ghế duy nhất đó là một hàng chờ rất dài: tin nhắn chưa trả lời, câu nói hôm qua chưa nguôi, việc định làm từ tháng trước, và một nỗi lo không có tên cứ lởn vởn như con ruồi, đập hoài không trúng. Chúng không được nghĩ tới — chúng xếp hàng. Và thỉnh thoảng chen lên la một tiếng.\n\nCái hàng ấy không xếp theo mức đáng. Nó xếp theo hai đầu của cùng một trục.\n\n**Thứ đau vào trước.** Cái đang bị đòi, cái sắp hỏng, cái vừa chạm vào chỗ tự ái, cái chưa nguôi. Mình chạy khỏi nó, mà chạy khỏi tức là nghĩ về nó.\n\n**Thứ dễ chịu và gần tay vào trước.** Cái mở ra là có ngay, cái xoa dịu được cơn khó chịu trong người. Mình chạy về phía nó, mà chạy về cũng tức là nghĩ về nó.\n\nMột bên chạy khỏi đau, một bên chạy về chỗ êm. Cả hai đều không hỏi lấy một câu: món này có đáng không.\n\nCòn thứ đáng nhất đời bạn — sức khỏe, người thân, cái nghề — thì rơi vào đúng khe giữa. Nó không đau, nên không chen được. Nó cũng không dễ chịu ngay, mở ra còn hơi cực. Nó thua cả hai chiều cùng lúc, và đứng cuối hàng, năm này qua năm khác.\n\nChuyện lạ là chỗ này — chỗ quyết định gần như mọi thứ — hầu như không ai gác. Tiền thì người ta đếm. Giờ thì người ta xếp. Riêng chỗ này thả cửa, vì ba lý do.\n\nThứ nhất, **nó không nhìn thấy được.** Tiêu tiền thì thấy ví mỏng đi, hết giờ thì thấy đồng hồ. Còn đầu bị chiếm hết chỗ thì chẳng có gì báo — bạn vẫn thấy mình bình thường, chỉ là hôm nào cũng mệt mà không hiểu mệt vì cái gì.\n\nThứ hai, **có kẻ chủ động lấy.** Cả một ngành công nghiệp sống bằng chỗ trong đầu bạn, có số liệu, có thử nghiệm trên hàng triệu người. Họ chuyên nghiệp. Bạn tay không.\n\nThứ ba, **mất là mất luôn.** Nuôi thứ gì trong đầu thì lần sau thứ đó trồi lên dễ hơn. Nó không về mốc cũ. Nó dịch dần — và một ngày bạn nhận ra mình đã thành người hay nghĩ về đúng những thứ mình không muốn thành.\n\n---\n\n## Chương 3 — Ý niệm, thái độ, hành vi\n\nCâu nói làm mất một người bạn. Cái quyết định đổi cả hướng đời. Thói quen mười năm sau mới thấy hậu quả. Thứ nào cũng từng là một ý nghĩ nhỏ xíu, trồi lên vào một buổi chiều nào đó, và được cho ở lại.\n\nCái ra khỏi một con người đi theo đúng một chiều:\n\n> **Ý NIỆM → THÁI ĐỘ → HÀNH VI**\n\n**Ý niệm** là một ý vừa trồi lên. Chưa phải quan điểm, chưa phải chủ trương — chỉ là một cái nảy lên, sống vài giây, rồi hoặc tan hoặc ở lại.\n\n**Thái độ** là cái ý niệm ấy sau khi được cho ở lại và nghĩ đi nghĩ lại nhiều lần. Nó thành cách bạn nhìn một người, một việc, chính mình.\n\n**Hành vi** là cái đi ra ngoài: câu bạn nói, việc bạn làm, cái bạn quyết.\n\nNgười ta hay chữa ở bậc ba. Cố nói năng nhẹ nhàng hơn, cố chăm chỉ hơn, cố bỏ một thói quen. Chữa được, nhưng cực và hay tái, vì gốc nằm ở bậc một. Người nuôi trong đầu ý niệm *thằng đó chơi xấu mình* suốt nửa năm, thì tới lúc gặp nhau, không có kỹ năng giao tiếp nào cứu được câu nói bật ra khỏi miệng.\n\nVà chuỗi ấy không dừng ở hành vi. Hành vi làm nhiều lần thành thói quen, thói quen lâu ngày thành tính người, tính người thành số phận. Chuỗi này chạy một chiều, và chạy dù bạn có để ý hay không. Người suốt năm nuôi trong đầu chuyện ai nợ mình cái gì, mười năm sau thành một người khác hẳn người suốt năm nuôi chuyện mình đang dựng cái gì. Không phải ai giỏi hơn ai. Chỉ là hai cái đầu chứa hai thứ khác nhau, ngày này qua ngày khác.\n\nVì thế có hai loại sai, và người ta chỉ sợ loại nhỏ.\n\nSai tốc độ — làm chậm, làm kém, bỏ phí buổi sáng — thấy ngay, ai cũng lo, và cả một kệ sách được viết ra để chữa nó.\n\nSai hướng — làm rất nhanh, rất giỏi, rất kỷ luật, vào đúng thứ không đáng — thì không thấy được trong ngày, không thấy được trong tháng. Nó chỉ hiện ra sau nhiều năm, và lúc hiện ra thì thường không đổi được nữa. Trèo nhanh gấp đôi lên nhầm tường thì tới nơi sớm gấp đôi, chỉ vậy thôi.\n\nSách dạy trèo thì nhiều. Bộ này bàn chuyện dựng thang.\n\nCòn một điều nữa, đáng nói trước khi đi tiếp. Tiền, quan hệ, kiến thức, thời gian — bốn thứ người ta tính là vốn liếng — đều có người nhiều người ít. Chỗ trong đầu thì khác: ai cũng có, và ai cũng có hạn như nhau. Người giàu nhất nước cũng chỉ nghĩ được một thứ tại một thời điểm, y như bạn. Mà chính chỗ này quyết định bốn thứ kia được tiêu vào đâu. Nó không phải một khoản vốn ngang hàng — nó là cái quản mấy khoản kia. Đó là lý do có người rất nhiều tiền vẫn sống một cuộc đời chật chội, và có người ít tiền vẫn sống một cuộc đời rộng rãi. Họ khác nhau ở cái cổng, không khác nhau ở cái ví.\n\n---\n\n## Chương 4 — Cái trồi lên là một thước phim\n\nThử để ý cái vừa nhảy vào đầu bạn xem nó có hình dạng gì.\n\nNó hiếm khi là một chữ. Thường nhất, nó là **một cảnh**: vẫn cái phòng họp đó, vẫn câu nói đó, vẫn nét mặt đó, có khi vẫn đúng thứ ánh sáng của buổi chiều hôm ấy. Một thước phim ngắn, chiếu đi chiếu lại. Ít hơn thì là một câu chuyện, một giả thiết, một câu hỏi — nhưng bao giờ cũng có hình dạng, có diễn biến, chứ không phải một cái nhãn.\n\nNhưng không phải lúc nào cũng có cảnh. Có lúc trong đầu chỉ văng vẳng **một câu hỏi** — không phòng ốc, không ai nói gì, không hình ảnh nào. Đôi khi nó lộ ra ngoài, mắt nhìn xa xăm và mọi thứ trước mặt mờ đi; đôi khi chẳng lộ gì, chỉ tự nhiên thấy mình đang lặp lại một câu. *Rồi mình sống bằng gì? Bố còn sống được bao lâu nữa? Mình đang sống vì cái gì?*\n\nCâu hỏi trần thì gần đích hơn cảnh chứ không phải xa hơn: cảnh phải bóc ra mới thấy nó chạm vào cái gì, còn câu hỏi thì cái nó chạm vào nằm ngay trong câu. Chỉ có một loại phải coi chừng — câu hỏi nghe khô như chuyện kỹ thuật mà cứ trồi lên hoài. *Có nên bán không* thì nghe như chuyện tiền, hỏi kỹ ra lại là chuyện mình có tin vào cái đầu mình không.\n\nVà một cảnh không bao giờ vào một mình. Bước vào phòng khách không phải một người, mà cả một đám cùng một bối cảnh: chị Loan, cái bảng lương, mấy người ngồi nghe, ánh mắt của ai đó ở cuối bàn. Đó là lý do \"gọi tên nó bằng một chữ\" nghe dễ mà làm không nổi — trong cảnh có cả chục thứ để gọi tên.\n\n### Cảm xúc bám vào đâu\n\nCảm xúc **không bám vào người nào trong cảnh cả.** Nó bám vào **điều mà cảnh đó nói lên**.\n\nChị Loan nói trước phòng là số của mình chắc phải kiểm tra lại. Cái nghẹn không bám vào chị Loan. Nó bám vào điều câu ấy nói lên: *cả phòng nghĩ mình làm ẩu.* Và điều ấy bao giờ cũng trỏ về một **đối tượng** — ở đây là *hình ảnh của mình trong mắt đồng nghiệp.*\n\nĐó là lý do cùng một câu nói mà người này bỏ ngoài tai, người kia nhớ mười năm. Câu nói thì như nhau; cái nó chạm vào thì mỗi người một khác.\n\nĐối tượng ấy có một dạng cố định: **cái gì của ai.** Chị Loan không phải đối tượng, *cách tiêu tiền của chị Loan* mới là. Bản thân không phải đối tượng, *lời hứa của bản thân* mới là. Gia đình không phải đối tượng, *bữa cơm chung của nhà mình* mới là. Cái đứng trơ một mình — tiền, gia đình, bản thân — thì chấm cái nào cũng ra đáng, nên chấm cũng như không.\n\nVà cái trồi lên không phải một việc chờ xử. Nó là **một đối tượng đang xin chỗ trong đầu.** Nên câu tiếp theo không phải *làm gì với nó*, mà là *cái này có đáng suy nghĩ không.* Nhờ vậy mà một cảnh chẳng liên quan gì tới mình vẫn có thể chiếm chỗ chính đáng: chuyện chị Loan đối xử với bố mẹ ra sao thì mình chẳng làm gì được, nhưng *quan hệ với bố mẹ* thì đáng để tâm. Cảnh chỉ là cái cớ để đối tượng trồi lên.\n\n### Viết ra thì thấy\n\nMuốn thấy được cái nó chạm vào thì trước hết phải thấy được là đang có phim chạy — mà cái đó cần một khả năng chứ không phải một mẹo: để ý được cùng lúc cái đang hiện lên trong đầu và cái đang xảy ra trong người. Vai co lại, hàm siết, thở nông — thân bao giờ cũng biết trước.\n\nVà đây là chỗ đáng nói cho ai mới bắt đầu: **đọc ra được cái nó chạm vào đã là phần lớn rồi.** Viết được một câu — *lo rằng…*, *lẽ ra phải…*, *thấy ra là…* — là đã biết mình đang ở đâu, và đó là phần khó nhất. Mấy bước sau chỉ làm rõ thêm và xếp chỗ. Ngày nào chỉ tới được đó thì ngày đó vẫn tính là làm.\n\nCòn cái chạm vào thì thường viết ra được thành một câu, và câu ấy hay rơi vào mấy khuôn quen: *sợ rằng…*, *lo rằng…*, *mong rằng…*, *bực mình vì…*, *tiếc rằng…* Viết xong thì đối tượng nằm sẵn trong câu, chỉ việc gạch chân, không phải nghĩ thêm.\n\nCó một họ khuôn trỏ ngược vào trong — *bực mình với bản thân, thất vọng với bản thân, tự hào với chính mình, ngạc nhiên về chính mình.* Họ này phải nối thêm một vế mới dùng được: **vì cái gì của bản thân**. Thiếu ba chữ ấy thì câu trượt ra ngoại cảnh — *bực mình với bản thân vì hôm đó đông việc quá* — và cái phải nhìn lại rơi ra ngoài mình. Họ này cũng là họ duy nhất chạy được cả hai chiều: bực và xấu hổ thì lộ ra thứ cần sửa, còn tự hào và ngạc nhiên thì lộ ra thứ cần nuôi — mà thứ cần nuôi thì hầu như không bao giờ tự trồi lên.\n\nHai khuôn nữa đáng để ý. *Lẽ ra phải là…* — câu đó không kể chuyện đã xảy ra, nó kể một chuyện khác, cái chuyện mình cho là phải xảy ra; viết được nó ra là một kỳ vọng ngầm vừa lộ mặt. Và *thấy ra là…* — câu này không còn là cảm xúc nữa, nó là cái kết tinh lại sau khi cảnh chạy xong, và cảnh nào ra được câu ấy thì thường thôi trồi lên.\n\n### Trong vòng và ngoài vòng\n\nCó một chuyện đáng nói về chỗ đứng của mình trong cảnh.\n\nKhi cảnh ấy là chuyện của mình hoặc của người thân, mình là một phía trong đó — còn dây nối, còn chuyện chưa xong — nên cái trồi lên hầu như bao giờ cũng là cảm xúc còn hoen: sợ, lo, bực, tiếc, lẽ ra phải. Còn khi cảnh ấy là chuyện của người ngoài vòng, mình đứng ngoài, nhìn được cả cảnh, thì cái trồi lên thường lại là một câu bắt đầu bằng *thấy ra là.*\n\nChỗ khác nhau ấy hữu dụng hơn vẻ ngoài của nó, và nó giải được cái nút khó nhất của cả hệ.\n\n### Thứ đáng nhất thì không có phim\n\nPhim được gợi lên bằng cảm xúc. Mà những thứ đáng nhất thì cảm xúc rất mờ.\n\nKhông khí, giấc ngủ, vệ sinh cá nhân, cha mẹ — thứ nào cũng đáng bậc nhất, mà chẳng thứ nào chiếu cảnh nào bao giờ. Chúng không tự trồi lên, không phải vì bạn vô tâm, mà vì chúng không có phim. Còn thứ không đáng thì lúc nào cũng sẵn hình: màn hình sáng, ngón tay lướt, câu nói hôm qua với nguyên nét mặt người nói.\n\nNên với những thứ đáng, phải làm ngược lại: đã biết đối tượng rồi thì đi **dựng phim** cho nó. Đó là lý do người ta đi khám một lần cho biết số, hay ngồi tính xem còn gặp bố mẹ được bao nhiêu lần nữa — không phải để dọa mình, mà để cấp một cảnh cho một đối tượng vốn không có cảnh nào.\n\nNhưng dựng phim thì phải biết trước là dựng cho cái gì — tức là chỉ nuôi được cái mình đã biết là đáng. Cái đáng mà mình chưa biết là đang bỏ trống thì không dựng được, vì có biết đâu mà dựng.\n\nChỗ này là chỗ vòng ngoài vào việc. Nhìn chuyện người khác thì bài học tới trước, món bỏ trống theo sau: thấy ông hàng xóm dành sáng chủ nhật cho mẹ già, rồi mới lòi ra quan hệ với bố mẹ của mình lâu nay để đấy. Không cần cảm xúc nào của mình để khởi động, và không phải trả giá bằng một lần hỏng việc của chính mình. Đó là cách duy nhất tìm ra một món đáng mà mình chưa biết là mình đang thiếu.\n\n---\n\n## Chương 5 — Áp lực\n\nCùng một việc, hôm nay không áp lực, tuần sau ép muốn nghẹt thở. Việc không đổi. Cái đổi là bạn đã nhìn thấy cái giá phải trả.\n\nHạn nộp còn ba tháng thì không áp lực — không phải vì việc nhẹ, mà vì cái giá của việc không xong còn ở xa, còn mờ, nghĩ tới thấy trừu tượng. Còn hai ngày thì ép, vì cái giá đã hiện rõ mồn một: mất mặt trước ai, mất khoản nào, ai sẽ nói câu gì.\n\nNhưng thấy cái giá chưa đủ. Cùng một cái giá, hai người chịu khác hẳn nhau — vì còn phụ thuộc mình có trả nổi không. Hai người cùng một khoản nợ, người có sẵn chỗ vay thì ngủ được, người không nghĩ ra ai để hỏi thì thức trắng. Khoản nợ y hệt.\n\nGhép hai vế lại là ra định nghĩa dùng cho cả bộ sách:\n\n> **ÁP LỰC = CÁI GIÁ ĐÃ HIỆN RA / KHẢ NĂNG TRẢ MÀ BẠN THẤY MÌNH CÓ**\n\nHai chỗ trong công thức này phải đọc chậm.\n\n**Tử số tính theo độ rõ, không theo độ lớn.** Cái giá nhỏ mà hiện rõ ép mạnh hơn cái giá lớn mà còn mờ. Đây là chỗ hỏng của gần như mọi người: đầu chấm theo độ rõ, nên người ta bỏ cả năm chạy theo mấy việc lặt vặt có giấy báo, trong khi sức khỏe với con cái — những cái giá lớn nhất đời — thì để đấy, vì chưa cái nào gửi giấy.\n\n**Mẫu số là khả năng bạn *thấy* mình có**, không phải khả năng thật. Lúc đó, trong đầu bạn, bạn nghĩ ra được mấy đường. Chỉ vậy thôi. Ai tự tin nhầm thì vẫn thấy nhẹ — thước này đo cái ép mình đang chịu, không đo mình đúng hay sai.\n\nCông thức này giải thích được những chuyện mà chữ \"gấp\" không giải thích nổi. Vì sao cái ấm ức mười năm vẫn ép, dù chẳng có hạn nào — vì cái giá hiện rõ mỗi lần nghĩ tới, mà lại chẳng có đường nào trả. Vì sao sức khỏe không áp lực, cho tới một hôm nó ép kinh khủng — cái giá vốn có sẵn từ mười năm trước, chỉ chưa hiện; tới lúc cầm tờ kết quả khám thì nó hiện, và ép ngay lập tức. Vì sao người khác ép được bạn — họ không tạo ra cái giá, họ chiếu đèn vào nó; câu \"anh không làm thì bên kia đánh giá thế nào\" là một động tác chiếu đèn. Vì sao viết ra lại nhẹ — cái giá chưa viết thì không có hình dạng, mà cái không hình dạng thì đầu tự cho nó cỡ vô hạn. Và vì sao nói chuyện với một người lại đỡ hẳn dù họ chẳng giúp gì — vì họ nâng mẫu số: có người biết chuyện là bạn có thêm một đường, dù chưa dùng tới.\n\n### Hai chữ \"giá\"\n\nBộ này dùng chữ \"giá\" ở hai chỗ, và hai chỗ đo hai thứ khác nhau. Lẫn là hỏng cả hệ.\n\nGiá ở **áp lực** là mình mất gì nếu *không làm* — và tính theo phần đã hiện ra. Như tiền phạt đã có giấy báo. Nó đổi từng ngày.\n\nGiá ở **đáng** (chương sau) là cái phải bỏ ra để *có* nó — đã có sẵn chưa, và với nguồn lực mình đang có thì trả dễ hay khó. Như học phí. Nó ổn định, tính một lần dùng cả tuần.\n\nMột cái là tiền phạt, một cái là học phí, và chúng độc lập với nhau. Việc học phí rẻ mà tiền phạt đã có giấy báo — rất áp lực, đáng — chính là loại việc ăn hết ngày của dân văn phòng. Việc học phí nặng mà chưa có giấy báo nào — rất đáng, không áp lực — chính là loại việc cứ nằm cuối hàng. Không phải vì nó không có cái giá. Vì cái giá của nó chưa hiện.\n\n### Bốn cái núm\n\nCùng một cái giá, cùng một khả năng trả, độ ép vẫn khác nhau — vì còn bốn thứ điều chỉnh. Bốn cái này lấy từ nghiên cứu stress lâu năm, và cái hay là chúng đều vặn được.\n\n**Kiểm soát.** Việc y hệt, nhưng mình quyết được một phần thì nhẹ hẳn. Vặn bằng cách giành lấy một phần quyết được: cắt phạm vi, chọn phương án, tự đặt mức \"đủ\".\n\n**Đoán trước được.** Không biết lúc nào ập tới thì phải căng suốt. Vặn bằng lịch, bằng hẹn, bằng hỏi cho rõ ngày giờ.\n\n**Chỗ xả.** Ức lại trong người, không đi đâu được, thì tự nó thành áp lực. Vặn bằng viết ra, nói ra, vận động.\n\n**Có người bên cạnh.** Thiếu cái này là nặng nhất trong bốn thứ. Vặn bằng một việc thôi: nói với một người. Không cần họ giải quyết gì.\n\nNhìn kỹ thì gần như mọi công cụ trong cuốn Dùng đều là một cách vặn bốn cái núm này. Viết ra là chỗ xả. Đặt lịch là đoán trước được. Cắt phạm vi là kiểm soát. Gọi một người là có người bên cạnh. Không phải trùng hợp — đó là lý do chúng chạy.\n\n### Con thú tắt được, người thì không\n\nCon thú bị đuổi thì bung hết sức chạy, thoát rồi thì tắt. Toàn bộ bộ máy chịu áp lực trong người bạn được làm ra cho đúng tình huống đó: căng một trận ngắn, xong thì tắt.\n\nNgười thì khác ở một chỗ: không cần bị đuổi mới căng. Chỉ cần *nghĩ tới* một cái giá là bộ máy đã chạy — mà cái nghĩ thì không có đích để thoát, nên nó không tắt. Người ta chạy cái bộ máy dành cho một trận nước rút trong nhiều tháng liền. Đó là lý do cái ấm ức âm ỉ lại tàn phá đến thế dù nó chẳng gấp gáp gì: cái giá trong đó không bao giờ tới, nên không bao giờ trả xong, nên bộ máy không có tín hiệu để tắt.\n\nVà còn một chỗ ít ai để ý: nộp xong báo cáo rồi mà tối vẫn không ngủ được. Vì đóng cái việc và đóng cái căng trong người là hai chuyện. Gửi email đi là việc xong, nhưng cơ thể chưa nhận được tín hiệu nào báo hết nguy — nó không đọc email. Sau một trận căng, phải làm thêm một việc cho cái thân: đi bộ, vận động ra mồ hôi, hoặc kể lại đầu đuôi cho một người nghe. Nghe thừa, nhưng đó là cách duy nhất nói với cơ thể rằng trận này qua rồi.\n\n### Áp lực làm gì cái đầu\n\nÁp lực không chỉ chiếm chỗ. Nó phá luôn cái máy đang xử nó.\n\nNó **thu hẹp**: càng ép càng chỉ thấy một hai đường, thường là đường quen chứ không phải đường tốt. Nó tạo **vòng lặp**: cùng một ý quay lại lần thứ mười, không thêm gì mới — tưởng đang giải quyết, thật ra đang chạy tại chỗ. Và nó **tràn**: ép từ một việc làm mọi việc thành nặng, ngồi ăn cơm cũng không yên.\n\nNhưng điều tệ nhất nằm ở chỗ khác. Cái phần trong đầu dùng để cân nhắc, để nói không, để chọn cái đúng thay vì cái sướng — nó chạy bằng pin, và áp lực rút pin rất nhanh. Ép cả ngày thì tối nó cạn.\n\nLúc cạn pin, bạn không tự nhiên thành người xấu. Bạn chỉ mất khả năng chọn. Và khi mất khả năng chọn thì bạn trôi về phía nào ít lực cản nhất. Nhìn lại mà xem, chuyện này lặp lại giống nhau đến kỳ lạ: ngày căng nhất thì tối lướt điện thoại lâu nhất; họp mệt xong thì mua đồ ăn chứ không nấu; tuần áp lực cao thì bỏ tập, bỏ đọc, bỏ gọi về nhà — đúng những thứ đáng nhất.\n\nKhông phải bạn thích mấy thứ đó hơn. Chỉ là lúc cạn pin, thứ nào đã được dọn sẵn thì thứ đó thắng. Mà những thứ dọn sẵn nhất trên đời đều có người thiết kế cho bạn khỏi phải nghĩ: mở khóa điện thoại là có ngay. Còn cuốn sách đọc dở nằm trong ngăn kéo, cuộc gọi về nhà thì phải nghĩ xem nói gì.\n\nTừ đó mà ra cái câu, nếu chỉ mang được một câu ra khỏi cả bộ sách này, thì mang câu này:\n\n> **Đừng trông vào ý chí lúc mệt. Hãy dùng lúc tỉnh để dọn đường, sao cho lúc mệt, việc đáng làm lại là việc dễ làm nhất.**\n\nToàn bộ cuốn Dùng — chín ô, cái lịch tuần, buổi rà — chỉ phục vụ đúng một câu đó.\n\n### Hạ áp\n\nĐang ép mạnh mà cố \"nghĩ cho ra\" là vô ích: cái máy nghĩ đang hỏng. Thứ tự đúng là hạ áp trước, nghĩ sau. Mà theo công thức ở đầu chương, hạ áp có đúng bốn đường — ba đường hạ tử số, một đường nâng mẫu số.\n\nĐo cho đúng cỡ: viết cái giá thật ra giấy, vì phần lớn cái giá bị thổi phồng lúc chưa có hình dạng. Câu rẻ nhất là *\"tệ nhất thì sao?\"* — trả lời cho hết, nỗi sợ sẽ có đáy, và đáy thường nông hơn tưởng. Làm nó nhỏ đi: cắt phạm vi, hạ mức đủ, báo trước cho người liên quan. Đẩy nó xa ra: xin lùi hạn. Và tăng khả năng trả: gọi một người, hỏi người từng làm rồi — đường hay bị quên nhất, mà thường nhanh nhất.\n\nCòn một đường thứ năm, nằm ở tầng dưới cả bốn đường kia. Nó có chương riêng: Chương 7.\n\n---\n\n## Chương 6 — Đáng\n\nNgười xếp việc đi qua ba bậc.\n\nBậc một, xếp theo cái đau và cái dễ chịu: cái nào đau thì gỡ trước, hết đau thì làm cái êm. Phần đông ở đây, và không tự biết, vì lúc nào cũng thấy mình đang bận việc cần thiết.\n\nBậc hai, xếp theo ý nghĩa. Một ngày bạn tỉnh ra, bắt đầu hỏi *cái này có ý nghĩa gì với đời mình*. Tốt hơn hẳn. Nhưng có cái kẹt: thứ gì cũng có ý nghĩa nếu chịu tìm. Hỏi xong vẫn không xếp được thứ tự — và cuối ngày lại quay về làm cái đau nhất.\n\nBậc ba, thêm đúng một câu hỏi nữa: *đổi lại, nó ngốn của mình bao nhiêu?* Rồi chia:\n\n> **ĐÁNG = GIÁ TRỊ / GIÁ**\n\nCó mẫu số thì mới so được. So được thì mới xếp hàng được.\n\n### Giá trị: chết và sống\n\nGiá trị đi từ ý nghĩa. Mà ý nghĩa, hỏi cho tới cùng, không phải một câu — nó là hai điều kiện nhân hai hệ quả.\n\nHai điều kiện: **thiếu nó** và **có nó**. Hai hệ quả: **chết** và **sống**. Thành bốn câu, và phải hỏi đủ cả bốn:\n\n> Thiếu nó thì cái gì trong mình **chết**?\n> Thiếu nó thì cái gì trong mình **sống**?\n> Có nó thì cái gì trong mình **sống**?\n> Có nó thì cái gì trong mình **chết**?\n\nTrong mình có hai thứ chết và sống được: thể xác và tâm hồn. Mỗi câu hỏi cả hai, rồi hỏi thêm mấy phần và bao lâu. Câu đầu và câu ba cộng vào, câu hai và câu bốn trừ đi.\n\nChữ *chết* là chữ ăn tiền của cả thước, vì nó không hỏi *mục tiêu*, cũng không hỏi *mất mát*. Mất mát vẫn còn là chuyện sở hữu — mất khoản nào, mất cái gì. Còn cái chết là chuyện của chính mình.\n\nBốn câu, mỗi câu bắt một loại thứ mà ba câu kia để lọt.\n\n**Thiếu thì chết** bắt cái mình cần: giấc ngủ, người thân, cái nghề.\n\n**Có thì sống** bắt cái mình được, kể cả khi thiếu nó chẳng chết gì: học một kỹ năng mới, đi du lịch, làm việc thiện. Không có câu này thì mọi thứ chỉ nuôi mình theo chiều dương đều bị chấm không, xếp chung với lướt điện thoại.\n\n**Thiếu thì sống** bắt cái giá của kỷ luật. Bỏ tập thì được lại một tiếng — thật, không phải ngụy biện. Câu này trừ điểm, và trừ đúng: đó chính là lý do việc tốt lại khó.\n\n**Có thì chết** bắt cái càng có càng mất: rượu, thuốc lá, cờ bạc, so đo hơn thua, một mối quan hệ độc hại. Thiếu câu này thì rượu chấm ngang đi du lịch — vì cả hai đều \"thiếu chẳng chết gì, có thì được chút gì\". Có câu này thì rượu rơi xuống âm, và rơi một mình.\n\nVà đây là chỗ không ai chấm thay ai được, vì tâm hồn mỗi người mỗi khác. Người coi trọng cái nghề thì mất việc là chết một phần tâm hồn thật. Người không thích đọc thì bỏ đọc chẳng chết gì, mà cũng chẳng sống thêm gì. Hai người chấm hai điểm khác nhau cho cùng một món, và cả hai đều đúng.\n\n### Giá: nguồn lực đi vào\n\nGiá thì hai câu, và đây là chỗ nguồn lực đi vào: **có sẵn chưa**, và **dễ trả giá không**. Câu sau xét theo cái mình đang có — tiền, quan hệ, kiến thức, sức. Cùng một món, người nhiều tiền trả bằng tiền, người nhiều quan hệ nhờ được người, người có nghề tự làm lấy. Nên cùng một thứ mà hai người chấm hai giá khác nhau, và cả hai vẫn đúng.\n\nVới món ra âm thì hai câu này đọc ngược mà vẫn chạy: có sẵn và rẻ nghĩa là **khó bỏ** — rượu bán đầy đường, điện thoại nằm trong túi, cái ấm ức có sẵn trong đầu khỏi đi lấy. Mẫu nhỏ thì âm sâu hơn, đúng chiều.\n\n### Bảng cho thấy hình\n\n| Món | Giá trị | Giá | Đáng |\n|---|---|---|---|\n| Không khí, nước sạch, ngủ đủ | 18 | 2 | 9,00 |\n| Cha mẹ | 15 | 2 | 7,50 |\n| Vệ sinh cá nhân | 14 | 2 | 7,00 |\n| Cái nghề mình theo | 14 | 3 | 4,67 |\n| Con cái | 15 | 4 | 3,75 |\n| Nhà ở ổn định | 14 | 6 | 2,33 |\n| Danh tiếng, chức vụ | 1 | 6 | 0,17 |\n| Ấm ức, thù dai | −14 | 4 | −3,50 |\n| Rượu, thuốc lá | −12 | 2 | −6,00 |\n\nBa dòng đầu nói ra một điều mà lần đầu nhìn thấy ai cũng gợn: **thứ nuôi mình sống mà rẻ thì đáng nhất, chứ không phải thứ mình quý nhất.** Ai cũng quý con hơn không khí — mà thử một phút không có không khí xem. Bảng này không xếp hạng thiêng liêng. Nó xếp hạng cái đáng cho một chỗ trong đầu, và không khí thì đáng tuyệt đối mà chẳng đòi chỗ nào.\n\nDòng \"danh tiếng, chức vụ\" thì nói điều ngược lại, cũng đáng nhìn: thiếu nó chẳng chết gì, có nó cũng chỉ sống thêm chút ít, mà giá thì đắt nhất bảng. Nó rớt xuống gần không — trong khi ở ngoài đời, nó lại là thứ chiếm chỗ trong đầu người ta nhiều nhất.\n\nĐó là phát hiện chính của cả hệ: **phần lớn thứ chiếm nhiều chỗ nhất trong đầu là thứ ép rất mạnh mà chẳng đáng bao nhiêu.** Bảng xếp việc thông thường không thấy được điều này, vì nó gọi mọi thứ gấp là quan trọng.\n\n### Hai cái thước đo bạn, không đo món\n\nCùng một chuyện, người này ép muốn nghẹt thở, người kia thấy bình thường. Cùng một việc, người này chấm rất đáng, người kia chấm không đáng. Đó không phải một người chấm sai — đó là hai người khác nhau, và cả hai đều chấm đúng cho mình.\n\nVì hai cái thước này không đo cái món. Chúng đo **quan hệ giữa bạn và món đó**: bạn thấy mất gì, bạn sợ gì, bạn nghĩ mình xử được không, bạn thấy thiếu nó thì cái gì trong bạn chết. Đổi người là đổi hết.\n\nViệc thật của hai cái thước không phải cho ra con số. Là bắt bạn **nói rõ ra** cái mình vốn đã cảm thấy mà chưa gọi tên. Con số chỉ là cái rơi ra sau.\n\nBa hệ quả, và cả ba đều làm mọi thứ nhẹ đi. Điểm của bạn không so được với ai, và cũng không cần so. Mấy con mốc chia mức sẽ không bao giờ \"chuẩn\" — không phải vì chưa ai hiệu chuẩn, mà vì chẳng có chuẩn chung nào để hiệu chuẩn theo. Và cái chạy được là thứ tự trong bảng của chính bạn: món nào ép hơn món nào, món nào đáng hơn món nào — chỉ vậy là đủ để xếp ô.\n\nMột hệ quả nữa, ngược chiều: đừng dùng thước này để phán người khác — kiểu \"việc đó có gì đâu mà nó căng thế\". Trong bảng của họ, mẫu số khác bảng của bạn.\n\n### Chấm lúc yên, mổ lúc vào việc\n\nNgồi lúc đầu óc còn sáng mà chấm thì được một bảng để tham khảo. Nhưng bảng ấy chỉ ra được tới mức thô, và mức thô thì chấm không nổi: \"gia đình\" thì lúc nào chả đáng, \"tiền\" thì ai chả bảo đáng.\n\nMức chấm được chỉ lộ ra khi vào việc. Lúc ấy cái trồi lên không bao giờ là \"tiền\" — nó là cách tiêu tiền, cách kiếm tiền, cách để dành, cách đầu tư. Bốn nhánh ấy chấm khác nhau hẳn: có người cách kiếm thì rất đáng nghĩ mà cách tiêu thì không.\n\nNên thực chiến không phải chỗ tra lại cái bảng, nó là chỗ mổ cái bảng ra. Mỗi lần vào việc là một lần tách một mục thô thành mấy mục thật, và bảng càng dùng càng chi tiết ra chứ không phải càng dùng càng thuộc. Chấm giữa cơn cũng không sai gì — đó là một lần chấm trong hoàn cảnh thật, và chỗ nào vào việc thấy khác với lúc ngồi yên thì đó chính là chỗ đáng sửa.\n\nMổ ra rồi thì có thêm một thứ mà cả bộ sách này không có ở đâu khác: **đếm được**. Nhánh nào trồi lên nhiều nhất là nhánh đang chiếm chỗ thật, bất kể lúc yên mình chấm nó bao nhiêu điểm. Đó là con số duy nhất trong cả hệ mình đo được chứ không phán đoán, nên nó đáng tin hơn mọi điểm ở trên.\n\n---\n\n## Chương 7 — Kỳ vọng\n\nChương 5 nói áp lực là cái giá đã hiện ra. Còn một câu chưa hỏi: cái giá ở đâu ra?\n\nNó luôn là khoảng cách giữa cái bạn mong và cái sắp xảy ra. Không mong gì thì không mất gì, và không mất gì thì chẳng có cái giá nào để mà ép.\n\nNgười không trông chờ được khen thì bị chê cũng chẳng đau. Người đinh ninh mình sẽ được cất nhắc thì không được cất nhắc là mất một khoản lớn — dù cả hai, xét cho cùng, đều chỉ đang ở nguyên chỗ cũ. Không ai mất gì cả. Nhưng một người thấy mất, vì người đó đã tiêu trước một thứ chưa có.\n\nKỳ vọng là thứ sinh ra cái giá. Chỉnh nó là chỉnh vào nguồn, không phải chỉnh cái đã chảy ra. Đó là đường hạ áp thứ năm — và nó nằm dưới cả bốn đường kia, vì nó không chỉ đổi áp lực.\n\n**Nó đổi cả cái đáng.** Chỗ này ít ai để ý, mà mạnh hơn nhiều.\n\nĐổi giá trị: mong con vào trường chuyên thì việc ép con học có giá trị rất cao. Đổi thành mong con lớn lên tử tế và tự đứng được, thì cùng cái việc ép học ấy tụt giá trị ngay — không cần thêm một dữ kiện mới nào. Việc y hệt, điểm khác hẳn.\n\nĐổi giá: kỳ vọng phải làm cho hoàn hảo thì việc nào cũng đắt — mở ra không đóng lại được, xong rồi vẫn quay lại sửa, ngốn chỗ nhiều lần. Đặt một mức \"đủ\" rõ ràng là hạ giá thật, đo được, không phải tự an ủi.\n\nNên một lần chỉnh kỳ vọng làm được ba việc cùng lúc: hạ áp, hạ giá, đổi cả giá trị. Không công cụ nào khác trong bộ này làm được cả ba.\n\nCái khó là kỳ vọng ít khi được nói ra — kể cả với chính mình. Nó trốn ở bốn chỗ: kỳ vọng về mình (phải làm được, phải nhanh, phải không sai — dấu hiệu là xong việc rồi vẫn thấy chưa đủ tốt); về người khác (họ phải hiểu, phải nhớ, phải cảm ơn — dấu hiệu là mình bực mà đối phương không biết mình bực vì cái gì); về cái người khác mong ở mình (gồng theo một mức mà thật ra chưa ai yêu cầu); và về hoàn cảnh (đáng lẽ phải suôn sẻ, đáng lẽ phải công bằng).\n\nChữ **\"đáng lẽ\"** là cái còi báo. Hễ nghe mình nói *đáng lẽ nó phải…*, *đáng lẽ mình phải…* thì dừng lại: một kỳ vọng ngầm vừa lộ diện. Ghi nó ra. Phần lớn kỳ vọng ngầm chỉ cần bị nhìn thấy là tự co lại đúng cỡ.\n\nChỉnh thì bốn bước, mười phút: viết kỳ vọng ra thành câu — *mình mong chuyện này kết thúc thế nào?* Hỏi nó ở đâu ra — của mình thật, hay của bố mẹ, của mạng, của mình hồi hai mươi tuổi mà giờ không còn hợp. Tách mong muốn khỏi đòi hỏi — *mình muốn nó thế* thì hụt là buồn, buồn rồi thôi; *nó phải thế* thì không được là đau và ép; cùng một điều mong, hai cách giữ, hai mức áp lực khác hẳn. Và đặt lại mức \"đủ\" bằng con số hoặc câu cụ thể — không phải \"làm tốt\", mà là \"xong trước thứ Sáu, ba lỗi trở xuống, không cần đẹp\".\n\nChỉ có một cái bẫy, và nó là cái bẫy lớn nhất chương: hạ kỳ vọng và bỏ cuộc, nhìn từ bên trong, giống hệt nhau. Người trưởng thành và người trốn việc nói y một câu — *thôi, không cần thiết.*\n\nPhép phân biệt duy nhất tôi thấy chạy được là hỏi sau khi hạ:\n\n> **Hạ xong rồi, mình còn muốn làm nó không?**\n\nHạ đúng thì việc nhẹ đi mà vẫn làm — thậm chí làm nhiều hơn, vì hết sợ. Người chuyển từ \"phải viết cho hay\" sang \"cứ viết đã\" thì viết nhiều hơn hẳn. Còn người chuyển sang \"thôi không viết nữa\" thì đó không phải chỉnh kỳ vọng. Đó là bỏ.\n\n---\n\n## Chương 8 — Chánh niệm\n\nCó những lúc bạn ở hẳn trong cái đang xảy ra. Rửa bát mà chỉ có nước, bát, tay. Đi bộ mà chỉ có bước chân với con đường. Ngồi với một người mà chỉ có người đó — không có cái điện thoại trong túi, không có cuộc họp sáng mai.\n\nKhông phải bạn đang tập trung. Tập trung là gồng. Cái này ngược lại — nó nhẹ. Không có gì phải giữ, vì không có gì đang kéo đi.\n\nNhà Phật gọi là **chánh niệm**: có mặt trọn vẹn với cái đang xảy ra, không dính vào cái vừa qua, không phóng tới cái chưa tới. Ai cũng đã từng ở trong đó. Không phải chuyện xa lạ, cũng không phải chuyện của người tu. Chỉ là nó tới rồi đi, và phần lớn thời gian mình không ở đó.\n\nVì sao có ngày cả ngày không có lấy một phút như thế — chương Áp lực đã trả lời sẵn rồi. Cái giá hiện ra bao giờ cũng nằm ở chỗ khác: ở tuần sau, ở chuyện hôm qua, ở điều người ta sắp nói. Hễ có cái giá đang hiện là đầu bạn đang ở đó, không ở đây. **Áp lực chính là cái kéo mình ra khỏi hiện tại.** Càng nhiều cái giá đang hiện, càng ít lúc có mặt — ngày ép nặng thì ăn cơm không biết mình ăn gì, con nói chuyện mà không nghe được câu nào.\n\nVà ngược lại, chỗ này mới đáng nói: những lúc trọn vẹn nhất trong đời bạn đều là lúc không có cái giá nào đang hiện ra. Không phải lúc bạn giỏi hơn, mạnh hơn, hay quản lý khéo hơn. Chỉ là lúc chẳng có gì kéo đi.\n\nĐây là chỗ khác hẳn mọi chương còn lại trong bộ sách. Mọi thứ khác là đồ nghề: bảng, công thức, danh sách, lịch. Cái này không có đồ nghề, vì nó không phải việc để làm. Nó là cái còn lại khi thôi làm. Không có bước một bước hai. Không chấm điểm. Không xếp ô. Bạn không đạt được nó — bạn chỉ có lúc ở trong đó và lúc không.\n\nCho nên đừng biến nó thành một mục trong danh sách. Vừa đặt mục tiêu tuần này ngồi bao nhiêu phút là nó thành một món phải làm, có cái giá, có áp lực — tức là thành đúng thứ nó vốn không phải.\n\nNói vậy không có nghĩa là ngồi chờ. Có mấy cửa mở sẵn, ai cũng đi qua được.\n\n**Một việc, làm trọn.** Rửa bát mà chỉ rửa bát. Đi bộ mà không nghe gì trong tai. Ăn cơm mà không cầm điện thoại. Thiền sư Thích Nhất Hạnh viết cả một cuốn về đúng chuyện này — *Phép lạ của sự tỉnh thức* — và ý cốt lõi rất giản dị: công việc thường ngày nào cũng thành phép lạ khi mình có mặt trọn vẹn trong đó. Rửa bát để rửa bát, không phải rửa cho xong để làm việc khác.\n\n**Ba nhịp thở.** Trước khi mở cửa vào nhà. Trước khi bấm gọi. Giữa hai việc. Ba nhịp thôi, không cần chỗ, không cần giờ. Cửa này rẻ nhất và bền nhất.\n\nỞ Làng Mai, cứ mười lăm phút lại có một tiếng chuông, và ai nghe cũng dừng lại, trở về hơi thở, không làm gì cho tới khi chuông dứt. Ngoài đời không có chuông ấy, nhưng có một thứ thay được: **mỗi lần bối cảnh bên ngoài đổi.** Từ giường ra nhà tắm, từ nhà ra xe, rời một cuộc nói chuyện. Cuốn Dùng lấy đúng mốc đó làm nhịp chính trong ngày, và gọi nó là *chuyển cảnh*.\n\nChú ý là **bối cảnh bên ngoài**, không phải cảnh trong đầu. Cảnh trong đầu thì tự tới tự đi, mình không hẹn được với nó. Còn bối cảnh ngoài thì mình biết chắc lúc nào nó đổi — và đó chính là chỗ dựa: một cái mốc không cần canh, không cần nhớ.\n\nCái tiếng chuông ấy dạy thêm một điều nữa, mà phải ở đó mới thấy: **nó chỉ đổ lúc người ta an.** Không ai vừa bưng nồi vừa dừng lại thở. Nên điều kiện của mọi lần trở về là *an*. Mà an thì đo được bằng một câu ngắn tới mức không cần nhớ:\n\n> **Ngồi xuống, nằm xuống — là an. An là trở về.**\n> **Đi đứng — nên là chánh niệm.**\n\nKhông phải canh giờ, không phải nhớ mốc nào. Cái thân tự báo: ngồi hoặc nằm xuống được tức là dừng được, nhắm mắt được, thở ba nhịp được. Rút được điện thoại ra thì đã ngồi rồi, đã an rồi — và đó có khi là cửa hay dùng nhất trong ngày.\n\nCòn lúc đang đi, đang làm bằng tay chân thì không trở về theo kiểu ấy được. Nhưng đó cũng không phải khoảng trống — đó chính là chỗ của chánh niệm, và chánh niệm thì không có việc gì để làm cả: chỉ trọn vẹn với bước chân, với cái đang xảy ra.\n\nChữ *nên* ở vế sau không phải lời khuyên đạo đức, nó là chuyện an toàn: đi mà đầu đang chạy ở chỗ khác thì vấp, thì lỡ đèn đỏ, thì đổ đồ. Bước chân đang đi mà mình không ở đó thì ai ở đó.\n\nVà phải nói cho rõ, không thì thành hiểu nhầm: **chánh niệm không do tư thế quyết.** Ngồi cũng chánh niệm được — có lúc dừng lại tự hỏi trong đầu đang có gì, thì thấy cái đang có trong đầu chính là cái đang diễn ra trước mắt, không có cảnh nào khác. Đó là chánh niệm, và lúc ấy chẳng có việc gì để làm cả: mình đang ở trong nó rồi.\n\nCó một chỗ ở giữa, và nó đáng nói vì ai cũng làm mà ít ai để ý: **vừa đi vừa nghĩ.** Nghĩ lúc đi nhiều khi ra được cái mà ngồi ở bàn không ra, vì đầu lỏng hơn. Nhưng có hai thứ rất khác nhau nằm chung một tên. **Chọn nghĩ** là mình mở ra trước khi đi, rồi mang theo đúng một cái. **Bị nghĩ** là không mở gì cả, cảnh tự vào rồi kéo mình đi hết đường mà chẳng nhớ đã qua đâu.\n\nPhân biệt hai cái không cần xét nội dung, chỉ cần hỏi: *lúc nãy mình có mở không?* Không nhớ có mở tức là không mở. Và nếu đang bị kéo mà chợt nhớ ra thì mở ngay tại đó — chợt nhớ ra chính là lúc vừa tỉnh, mở là từ giây ấy trở đi thành chọn.\n\nChuyển cảnh cũng là chỗ **nghi thức** bám vào. Mấy việc rất đáng mà không có gì thúc thì khó giữ bằng lời hứa; giữ được là nhờ có một nghi thức bám vào một cửa cố định — rửa bát xong thì rót ly nước, tắt đèn trần bật đèn bàn, ngồi xuống đọc. Cái làm nó chạy không phải quyết tâm, mà là cái cửa: qua cửa ấy thì phần sau tự đi.\n\n**Ngồi yên mười phút.** Ngồi, để ý hơi thở vào ra. Ý niệm trồi lên — chắc chắn trồi lên, rất nhiều — thì không đuổi, không theo, chỉ biết là có rồi quay lại hơi thở. Quay lại hai trăm lần cũng không sao: hai trăm lần quay lại chính là chuyện đang diễn ra, không phải dấu hiệu làm hỏng.\n\nNgười mới hay kết luận \"đầu tôi ồn quá, tôi không hợp\". Đầu bạn vẫn ồn như thế mọi ngày; chỉ là hôm nay bạn mới nhìn thấy. Nhìn thấy được cái ồn không phải thất bại.\n\nCuối cùng, một chỗ hay bị lẫn. Có một trạng thái nghe rất giống mà không phải: **dòng chảy** — lúc làm một việc khó vừa tầm, say đến quên thời gian, ngẩng lên đã hết buổi chiều. Nhà tâm lý học Csikszentmihalyi mô tả đó là lúc con người thấy mình sống trọn nhất, khi độ khó của việc vừa khớp với tay nghề. Hai cái giống nhau ở chỗ đều mất cảm giác gồng. Khác ở chỗ: dòng chảy cần một việc đủ khó để cuốn mình vào; chánh niệm không cần việc gì cả — rửa bát cũng được, ngồi không cũng được. Nói ra để tránh một hiểu nhầm quen thuộc: chưa bao giờ vào được dòng chảy không có nghĩa là không thể có mặt trọn vẹn. Cái sau không đòi hỏi tay nghề gì.\n\n---\n\n## Lời cuối — Quản để làm gì\n\nCả cuốn Dùng dạy xếp món. Nhưng nếu xếp cho khéo chỉ để cái đầu lúc nào cũng đang chứa đúng thứ — không lúc nào được rỗng — thì cái đích ấy cũng chật.\n\nChỗ trong đầu không phải cái kho cần chất cho đầy thứ tốt. Nó là chỗ để sống. Có lúc chứa một việc đáng, có lúc chứa một người mình thương, và có lúc không chứa gì cả — chỉ có tiếng nước chảy, hơi thở, ánh chiều ngoài cửa.\n\nQuản cái đầu không phải để nhét được nhiều thứ đáng hơn vào. Là để thỉnh thoảng nó được rỗng.\n\nChín ô trong cuốn Dùng có tên gọi riêng, và tên nói luôn động tác: **1 Đóng cửa tập trung · 2 Dự án thực thi · 3 Nề nếp thông minh · 4 Nghĩ đủ rồi thôi · 5 Gom một mẻ · 6 Nghiên cứu và trải nghiệm · 7 Trả về đúng chủ · 8 Hẹn giờ mà nghĩ · 9 Xóa và dựng rào.**\n\nTrong chín cái tên ấy có hai dòng chảy. Một là **ô 6 chảy về ô 2, rồi ô 2 chảy về ô 3** — từ kho ẩn thành dự án, từ dự án thành nề nếp. Ô 6 là chỗ chứa những món rẻ mà giá trị chưa hiện ra: cuốn sách ai đó giới thiệu, người bạn cũ, một cách làm mới. Nhìn thì không bao giờ biết nó đáng bao nhiêu, phải thử mới biết — mà thử thì mất có một buổi, còn được thì không có trần. Nên ô 6 là ô duy nhất còn có thể cho ra một thứ rất đáng mà mình chưa hề nghĩ tới.\n\nCòn ô 2 giao cho ô 3 bằng hai đường, không phải một. Một là **để lại một nếp** — đi khám xong thì để lại nếp khám định kỳ. Hai là **đổi bối cảnh** cho cái nếp sẵn có chạy dễ hơn: sửa phòng ngủ cho tối và mát thì chẳng để lại nếp nào, nhưng nó làm giấc ngủ rẻ đi mỗi đêm. Đường thứ hai thường bền hơn, vì bối cảnh không cần ai duy trì.\n\nChín ô ấy chia làm ba nhóm. **Sinh lợi — ô 2, 3, 6:** mình chủ động chọn và gieo, và nó cho ra cái mới. **Xử lý — ô 1, 4, 5:** việc có thật, làm cho xong, xong là về mức không chứ không để lại gì. **Dọn dẹp — ô 7, 8, 9:** cái chen vào mà chẳng đáng, dọn được thì lấy lại chỗ.\n\nBa nhóm gần trùng ba cột của bảng, lệch đúng ô 1: nó rất đáng thật, mà là cháy nhà — mình không chọn nó, và dập xong thì không để lại nếp nào.\n\nChỗ đáng nhớ là dọn dẹp với xử lý làm cho hay đến mấy cũng chỉ đưa mình về mức không. Muốn giàu lên thì phải gieo, mà gieo chỉ có ba ô. Nên tuần nào cạn giờ thì cắt hai nhóm kia, đừng cắt nhóm sinh lợi.\n\nDòng thứ hai là **ô 2 chảy về ô 3.** Phần lớn dự án đáng làm đều là để dựng một nếp — đi khám xong thì để lại nếp khám định kỳ, học một kỹ năng xong thì để lại nếp dùng nó. Còn ô 3 thì không chật, vì mấy món trong đó phần lớn rẻ: thở không cản ngủ, ngủ không cản gọi mẹ. Cái làm chật là tám ô kia.\n\nTới đây là hết phần thấy. Khi nào sẵn sàng làm, mở cuốn **Dùng** — hai trang đầu của nó là toàn bộ hệ thống và việc phải làm trong một ngày. Khi nào muốn xem số trước, mở cuốn **Thử**. Còn khi nào không muốn làm gì cả, mở cuốn **Cảm**.\n\n*— Hết cuốn Thấy —*\n", "dung": "# KHÔNG GIAN TRONG ĐẦU\n\n## Cuốn DÙNG\n\n*Bộ năm: **Thấy · Dùng · Chấm · Cảm · Thử***\n\n*Cuốn này để chạy — chỉ có những gì cần cho một ngày và một tuần. Hai trang đầu là đủ để bắt đầu.*\n\n*Nhịp 4 và 5 trong năm nhịp bảo bạn hỏi **có đáng không** và **có áp lực không**. Áng chừng là chạy được, và phần lớn thời gian áng chừng đúng. Khi nào muốn chấm kỹ bằng điểm số thì mở cuốn **Chấm**.*\n\n**Biểu tượng:** 📌 GHI NHỚ · 💡 MẸO · ⚠️ COI CHỪNG\n\n---\n\n## BẢN ĐỒ\n\nMọi thứ trong đầu bạn rơi vào đúng một ô của bảng này, và mỗi ô có sẵn cách xử. Hàng ngang: món này **ép** mình tới đâu. Hàng dọc: nó có **đáng** không.\n\n| | **Rất đáng** | **Đáng** | **Không đáng** |\n|---|---|---|---|\n| **Rất áp lực** | **Ô 1 — ĐÓNG CỬA TẬP TRUNG** | **Ô 4 — NGHĨ ĐỦ RỒI THÔI** | **Ô 7 — TRẢ VỀ ĐÚNG CHỦ** |\n| **Áp lực** | **Ô 2 — DỰ ÁN THỰC THI** | **Ô 5 — GOM MỘT MẺ** | **Ô 8 — HẸN GIỜ MÀ NGHĨ** |\n| **Không áp lực** | **Ô 3 ⭐ — NỀ NẾP THÔNG MINH** | **Ô 6 — NGHIÊN CỨU & TRẢI NGHIỆM** | **Ô 9 — XÓA VÀ DỰNG RÀO** |\n\n**Tám ô đẩy ra, một ô giữ lại.** Ô 3 là sức khỏe, người thân, cái nghề — thứ đáng nhất mà chẳng có gì thúc. Cả cuốn này về cơ bản là dọn tám ô kia để ô 3 có chỗ.\n\n**Ô 2 là cửa vào của ô 3.** Phần lớn dự án đáng làm đều là để dựng một nếp cho ô 3: đi khám sức khỏe xong thì để lại nếp khám định kỳ, học một kỹ năng xong thì để lại nếp dùng nó. Nên có một phép thử cho ô 2, hai nhánh — *xong thì để lại **nếp** gì?* hoặc *nó đổi **bối cảnh** nào cho nếp nào chạy dễ hơn?* Dự án sửa phòng ngủ cho tối và mát không để lại nếp nào, nhưng nó làm giấc ngủ rẻ đi mỗi đêm. Không được nhánh nào thì có khi nó là ô 4.\n\n**Ô 3 không chật.** Mấy món trong đó phần lớn rẻ — thở, ngủ, vệ sinh, gọi mẹ, giờ vàng — nên chúng đứng cùng nhau trong một ngày không tranh chỗ nhau. Cái làm chật là mấy ô bên phải.\n\n### Chín ô chia làm ba nhóm\n\n| Nhóm | Ô | Làm gì | Nó cho ra gì |\n|---|---|---|---|\n| **SINH LỢI** | **2 · 3 · 6** | Mình chủ động chọn và gieo | Cái mới — thứ chưa có thì có, thứ có rồi thì lớn lên |\n| **XỬ LÝ** | **1 · 4 · 5** | Việc có thật, phải làm cho xong | Về mức không. Xong là xong, không để lại gì |\n| **DỌN DẸP** | **7 · 8 · 9** | Cái chen vào mà chẳng đáng | Chỗ trống — và chỗ trống ấy đổ về nhóm sinh lợi |\n\nBa nhóm này gần trùng ba cột của bảng, lệch đúng một ô. Cột **rất đáng** là 1, 2, 3 — mà ô 1 lại nằm nhóm xử lý, không nằm nhóm sinh lợi. Đúng vậy: ô 1 rất đáng thật, nhưng nó là cháy nhà, mình không chọn nó và dập xong thì không để lại nếp nào. Còn cột **không đáng** thì trùng khít nhóm dọn dẹp.\n\n**Nhóm sinh lợi nối thành một đường: ô 6 → ô 2 → ô 3.** Ô 6 là kho chứa món rẻ mà giá trị chưa hiện; thử ra hướng thì thành dự án ở ô 2; dự án xong thì để lại một nếp ở ô 3. Đó là đường duy nhất trong hệ đưa vào được một thứ rất đáng mà mình chưa hề nghĩ tới.\n\n**Thứ tự dọn nhóm dọn dẹp: 9 → 7 → 8.** Ô 9 trước vì rẻ nhất và dọn được bằng tay chân, không cần nói với ai. Ô 7 sau vì khó hơn — phải mở miệng, phải chịu người ta khó chịu một lúc — mà đòn bẩy lớn nhất: sửa một cái van chặn được cả chuỗi. Ô 8 tự vơi khi hai ô kia sạch, vì ấm ức sống bằng đúng cái khe rảnh mà ô 9 đang chiếm.\n\n📌 **GHI NHỚ:** Cạn giờ thì cắt nhóm dọn dẹp và nhóm xử lý xuống mức tối thiểu, đừng cắt nhóm sinh lợi. Dọn cho sạch mà không gieo gì thì cái đầu chỉ trống, không giàu lên.\n\n**Ô 7 nguy hiểm nhất, ô 8 tốn nhất.** Ô 7 ép mạnh nên tự xưng là quan trọng, và bạn phục vụ nó trong khi tưởng mình đang làm việc. Ô 8 chẳng gấp gì nhưng chạy nền suốt tháng, ăn đúng phần chỗ trống mà ô 3 cần.\n\n**Quy trình bốn bước:** nhận ra có món → chấm → xếp ô → xử theo ô. Bỏ bước một thì ba bước sau không chạy. Lưu ý ở bước một: cái trồi lên là một **thước phim**, và cái đem đi chấm là **đối tượng chính** mà phim ấy chạm vào — phải bóc ra mới chấm được (mục 1).\n\n---\n\n## MỘT NGÀY CHẠY THẾ NÀO\n\nTrang này gom tất cả những gì phải làm trong một ngày và một tuần. Mọi mục sau chỉ là giải thích cho mấy bước ở đây.\n\n### Sáng — 2 phút\n\nNhìn ba món ô 3 của tuần (chọn ở buổi rà tuần). Hôm nay đụng vào món nào, lúc mấy giờ. Xong.\n\n### Trong ngày — khi có dấu hiệu\n\nNgoài ba cửa check-in, còn ba dấu hiệu báo có phim đang chạy: **người đổi trước** (vai co, hàm siết, thở nông) · **đang làm mà tay dừng** · **tự nhiên thèm cầm điện thoại**.\n\nThấy dấu hiệu thì rẽ một trong hai đường:\n\n**Đang bận, không dừng được** → ghi một dòng vào Danh sách chờ, quay lại việc. Ghi tức là hẹn. Hết.\n\n**Dừng được** → chạy năm nhịp:\n\n| | Hỏi | Ghi ra |\n|---|---|---|\n| **1** | Cảnh gì? | một hai câu |\n| **2** | Câu chuyện chạm đến cảm xúc là gì? | *lo rằng… / bực vì… / lẽ ra phải… / thấy ra là…* |\n| **3** | Đối tượng chính? | **[cái gì] của [ai]** — gạch chân ngay trong câu vừa viết |\n| **4** | Có đáng suy nghĩ không? | tra danh sách, hoặc áng chừng |\n| **5** | Có gây áp lực không? | chấm tại chỗ, vì áp lực đổi từng ngày |\n\nRa ô nào thì xử theo ô đó (mục 3–5). Việc dưới 2 phút thì làm luôn, không ghi.\n\n### CHECK-IN — nhịp chính trong ngày\n\nĐây là việc chính, và là việc rẻ nhất trong cả cuốn. Một nghi thức duy nhất, dùng cho mọi lần. Nhớ đúng một câu:\n\n> **Ngồi xuống, nằm xuống — là an. An là check-in.**\n> **Đi đứng — nên là chánh niệm.**\n\nKhông phải nhớ giờ, không phải nhớ cửa nào. Cái thân tự báo: ngồi hoặc nằm xuống được tức là dừng được, nhắm mắt được, thở ba nhịp được.\n\nCòn lúc đang đi, đang lái, đang bưng đồ thì không check-in được. Chữ **nên** ở đây không phải lời khuyên đạo đức — nó là chuyện an toàn: đi mà đầu đang chạy ở chỗ khác thì vấp, thì lỡ đèn đỏ, thì đổ đồ. Bước chân đang đi mà mình không ở đó thì ai ở đó.\n\n⚠️ **Chánh niệm không do tư thế quyết.** Ngồi cũng chánh niệm được, đi cũng có thể không chánh niệm. Bảng dưới nói *thân đang thế nào thì làm được gì*, không nói tư thế nào thì tỉnh thức hơn tư thế nào.\n\n| Thân đang | Làm được gì |\n|---|---|\n| Ngồi, nằm | **Check-in** — ba nhịp thở, ba câu. Một trong ba lối ra chính là chánh niệm |\n| Đi, đứng, làm bằng tay chân | Không check-in được. **Nên là chánh niệm** — trọn vẹn với bước chân, với việc đang làm |\n\n### Chọn nghĩ và bị nghĩ\n\nLúc đi vẫn nghĩ được, và nghĩ lúc đi nhiều khi ra được cái mà ngồi ở bàn không ra — đầu lỏng hơn, và đi bộ vốn là một chỗ xả. Nhưng phải tách hai thứ đang nằm chung một tên.\n\n**Chọn nghĩ** — mình **mở** trước khi đi, rồi mang theo đúng một cái. Có mở là có chủ.\n\n**Bị nghĩ** — không mở gì cả, cảnh tự vào và kéo mình đi. Hết đường mà không nhớ đã đi qua đâu.\n\nPhân biệt không cần phân tích nội dung, chỉ cần một câu: **lúc nãy mình có mở không?** Không nhớ có mở tức là không mở, tức là đang bị.\n\n**Mở lúc đi** cũng ba nhịp thở, ba câu, rồi thêm một câu nữa: *mình mang theo cái gì?* Chỉ một cái, và phải là cái **đã qua năm nhịp rồi** — đã bóc được đối tượng, đã biết nó đáng. Cảnh chưa bóc mà đem đi bộ thì nó không được ngẫm, nó chỉ chạy lại đúng vòng cũ.\n\n**Đóng lúc tới nơi**, để biết vừa mang theo cái gì và ra được gì. Không đóng thì cái đang ngẫm chạy tiếp vào bối cảnh sau.\n\n💡 **Đang bị nghĩ mà chợt nhớ ra thì mở luôn.** Không phải dừng lại tự trách, không phải đợi tới chỗ ngồi. Chợt nhớ ra chính là lúc vừa tỉnh — mở ngay tại đó, và từ giây ấy trở đi là chọn nghĩ. Cái vừa chạy hoang nãy giờ thì hoặc mang theo có chủ ý, hoặc thả ra và về với bước chân.\n\n### Ba cửa hay gặp\n\nCâu trên đã đủ dùng. Ba cửa dưới đây chỉ là ba chỗ hay ngồi xuống nhất, kể ra để dễ để ý lúc đầu.\n\n**Cửa 1 — chuyển cảnh.** Bối cảnh **bên ngoài** đổi: rời cuộc họp, từ nhà ra xe, từ xe vào công ty, từ giường ra nhà tắm, gấp cuốn sách xuống. Tới chỗ mới, ngồi xuống — check-in.\n\n⚠️ **Hai chữ \"cảnh\" trong cuốn này là hai thứ khác nhau.** *Cảnh bên trong* là thước phim — tự tới tự đi, mình không gọi cũng không đuổi được. *Cảnh bên ngoài* là bối cảnh vật lý — mình biết chắc lúc nào nó đổi. Check-in lấy mốc là cảnh **bên ngoài**, chính vì nó chắc: khỏi canh, khỏi nhớ.\n\n**Cửa 2 — cầm tới điện thoại.** Móc được máy ra thì đã ngồi rồi, tức là đã an. Cửa rẻ nhất mà bắt được nhiều nhất, vì cái tay móc máy hầu như bao giờ cũng là phản ứng với một cảnh vừa chạy — mà nó xảy ra mấy chục lần một ngày. Cửa này cũng vá chỗ hở của cửa 1: ngày ngồi lì một chỗ thì chẳng có chuyển cảnh nào, mà đó lại đúng là ngày móc máy nhiều nhất.\n\n**Cửa 3 — chợt nhớ ra.** Ngồi được thì làm ngay, không thì để lát. Không hẹn được, không đếm được, và chính vì vậy mà đáng: lúc chợt nhớ ra là lúc mình vừa tự tỉnh, tức là đã ra khỏi cảnh rồi. Bỏ qua thì phí một lần tỉnh sẵn có.\n\n### ĐÓNG và MỞ\n\nỞ cửa chuyển cảnh, check-in là **hai lượt riêng, cách nhau bởi quãng đi** — không gộp làm một.\n\n**ĐÓNG** — xong một việc, rời một nơi, tĩnh lại:\n\n> Ba nhịp thở.\n> **Vừa ở đâu?** · **Cơ thể vừa thế nào?** · **Cảnh nào vừa trong đầu?**\n\n**Rồi đi — và quãng đi là chánh niệm, không phải check-in.** Không hỏi gì, không ghi gì, chỉ đi. Đây là chỗ dễ trôi nhất trong ngày, tay hay tự móc điện thoại — mà móc được thì tức là đã ngồi hoặc đứng yên rồi, tức là đã an: dừng lại mà check-in, đừng lướt.\n\n**MỞ** — tới chỗ mới, an lại:\n\n> Ba nhịp thở.\n> **Đang ở đâu?** · **Cơ thể đang thế nào?** · **Cảnh gì đang trong đầu?**\n\nHai vế khác nhau đúng ở thì: *vừa* và *đang*. Vế đóng nhìn lại cảnh còn tươi — đứng dậy khỏi cuộc họp mà hỏi *cảnh nào vừa trong đầu* thì bắt được ngay; để tới lúc ngồi vào bàn mới hỏi thì nó đã lẫn với cái mới.\n\nỞ cửa 2 và cửa 3 thì chỉ có một lượt, dùng thì *đang*.\n\n### Ba câu đi từ ngoài vào trong\n\nHai câu đầu lúc nào cũng trả lời được — mở mắt là biết, sờ tới là biết — và chúng dọn đường cho câu ba, câu khó nhất.\n\nCâu ba có **ba đáp án**, không phải hai:\n\n**Không có cảnh nào đang chạy** → vào bối cảnh mới. Hết.\n\n**Có một cảnh khác đang chạy** → ghi một dòng vào Danh sách chờ rồi đi tiếp. Đứng ở cửa không đủ chỗ để chạy năm nhịp. Ghi tức là hẹn.\n\n**Cảnh trong đầu chính là cảnh đang diễn ra ở đây, bây giờ** → không ghi gì, không làm gì. Đó là chánh niệm, và mình đang ở trong nó rồi.\n\n📌 Đáp án thứ ba là đáp án tốt nhất, và cũng là đáp án hay bị bỏ sót — gặp nó mà không biết thì người ta đi tìm cho ra một cảnh nào đó để ghi, tức là tự lôi mình ra khỏi chỗ đang đứng. Gặp thì cứ ở yên đó, xong.\n\n**Bốn mốc chắc chắn có mỗi ngày**, để tập trước khi rải ra: **trước và sau khi ăn · trước và sau khi ngủ.** Bốn cái này là đóng và mở của một bối cảnh dài, và mỗi cặp làm một việc riêng. *Trước khi ăn* là chọn cảnh sắp vào — ăn mà cầm điện thoại thì bữa cơm thành ô 9. *Sau khi ăn* bắt cái trồi lên lúc no và chậm lại. *Trước khi ngủ* là mốc nặng nhất, vì cái gì mang lên giường thì nó chạy tiếp lúc mình không gác được. *Sau khi dậy* thì cái đang chờ sẵn lúc mở mắt là món đang chiếm chỗ nhất, chưa bị việc trong ngày phủ lên.\n\n📌 **Vì sao lấy mốc bối cảnh chứ không lấy mốc đồng hồ.** Chỗ chuyển bối cảnh chính là chỗ hàng chờ chen vào: đang làm dở thì đầu còn bận, cảnh khó chen; vừa rời việc cũ mà chưa vào việc mới thì đúng khe đó ô 8 và ô 9 nhảy vào. Dừng ở đó là dừng đúng chỗ, không phải dừng vì tới giờ. Nó cũng không cần nhớ — bối cảnh đổi là mình biết ngay. Và tần suất tự khớp với ngày: ngày chạy nhiều chỗ thì dừng nhiều, ngày ngồi yên một chỗ thì cửa 2 gánh.\n\n💡 **Check-in còn làm một việc mà không mốc nào khác làm được: chọn cảnh sắp vào.** Cảnh mới chưa bắt đầu, nên còn chọn được — vào phòng ăn thì ăn, hay vừa ăn vừa cầm điện thoại; ngồi vào bàn thì làm việc đã định, hay mở tab tin tức trước.\n\n📌 **Khối ô 3 tự nó được bảo vệ.** Giờ vàng là một bối cảnh liền — không có chuyển cảnh bên ngoài nào xảy ra trong đó. Còn nếu giữa khối mà tự nhiên muốn đứng dậy, đó là **cảnh bên trong** đang chạy, không phải chuyển cảnh: ghi một dòng vào Danh sách chờ rồi làm tiếp.\n\n**Check-in bắt, buổi tối xử.** Bắt thì phải dày và rẻ, xử thì cần ngồi và cần yên.\n\n### Tối — làm rõ một hai món\n\nNgồi xuống, mở Danh sách chờ ra, xem mấy dòng nhặt được trong ngày. **Chọn một hoặc hai dòng, không cần hết.** Dòng nào nặng nhất, hoặc dòng nào trồi lại nhiều lần trong ngày. Chạy năm nhịp cho nó. Còn lại để đó, buổi rà tuần gom.\n\nVì phần lớn dòng **tự chết nếu để yên**. Ghi ra là đã nhẹ rồi. Cái còn sống sau một ngày mới là cái đáng làm rõ.\n\n📌 **Ba tầng, ba tần suất.** Check-in **bắt** — suốt ngày, mỗi lần vài giây. Tối **làm rõ** — một lần, một hai món, mỗi món vài phút. Buổi rà tuần **phân loại và xếp ô** — gom, có bảng. Đừng làm rõ suốt ngày: dòng ghi thì rẻ, làm rõ thì cần ngồi và cần yên.\n\nXong thì thêm hai phút nữa, dọn cho ngày mai: **để sẵn thứ cần cho phiên ô 3 đầu tiên** — tập mở đúng trang, giày để cửa, bút gác lên. Và nếu hôm nay có trận căng thì **đi bộ mươi phút hoặc kể cho một người nghe**; cơ thể không đọc email.\n\n### Cuối tuần — 30 phút\n\nBuổi rà, chín bước (mục 9), chia hai nửa. **Dọn:** Trút → Chấm → Mổ → Gạch. **Sinh lợi:** Đếm → Rà bảng NGOÀI → Rà SỔ THỬ → Đặt khối → Chọn ba.\n\n---\n\n⚠️ **COI CHỪNG — tuần đầu đừng làm hết.** Làm đúng **check-in** thôi, và chỉ ở bốn mốc cố định — trước và sau khi ăn, trước và sau khi ngủ. Hai tuần liền. Khi nào thành phản xạ thì rải ra mọi lần đổi bối cảnh, rồi mới thêm buổi tối làm rõ và năm nhịp. Ôm cả trang này từ ngày đầu thì bỏ trong bốn ngày.\n\n💡 **MẸO — năm nhịp không đều nhau về công sức.** Nhịp 1–3 là việc thật, phải bóc. Nhịp 4 thì tra bảng đã chấm sẵn, gần như không tốn gì. Nhịp 5 phải chấm tại chỗ. Chạy quen rồi thì cả năm nhịp gọn trong một phút, và phần lớn thời gian là để viết chứ không phải để nghĩ.\n\n---\n\n## 1. Nhận diện — năm nhịp\n\nBạn chỉ xử lý được thứ bạn nhìn thấy. Phần lớn thời gian, người ta không nghĩ *về* một ý niệm — người ta **ở trong** nó: đang bực thì không thấy mình đang bực, chỉ thấy thằng kia sai.\n\nVà cái trồi lên không phải một chữ. Nó là **một cảnh** — vẫn cái phòng đó, vẫn câu nói đó, vẫn nét mặt đó — chiếu đi chiếu lại.\n\n**Mấy dấu hiệu hay gặp:** người đổi trước (vai co, hàm siết, thở nông) · đang làm mà tay dừng · tự nhiên thèm cầm điện thoại · đôi khi là mắt nhìn xa xăm, cảnh trước mặt mờ đi. Danh sách này không đóng — mỗi người mỗi kiểu, và cùng một người mỗi lúc một khác. Cái chung là **thân báo trước khi đầu biết**, nên đường vào dễ nhất là qua thân: thấy có gì đó đổi rồi mới lần ra đang có gì.\n\nBắt được rồi thì chạy năm nhịp:\n\n| Nhịp | Hỏi | Ví dụ |\n|---|---|---|\n| **1** | **Cảnh gì — hay câu gì?** | Chị Loan nói trước phòng là số của mình chắc phải kiểm tra lại |\n| **2** | **Câu chuyện chạm đến cảm xúc là gì?** | *Lo rằng* cả phòng nghĩ mình làm ẩu |\n| **3** | **Đối tượng chính** là gì? | Hình ảnh của mình trong mắt đồng nghiệp |\n| **4** | Có **đáng** không? | Có — thiếu nó thì một phần mình chết |\n| **5** | Có **áp lực** không? | Có, mà vừa — chưa ai đòi gì |\n\n### Khi trong đầu không có cảnh, mà là một câu hỏi\n\nKhông phải lúc nào cũng có cảnh. Có lúc mắt nhìn xa xăm, mọi thứ trước mặt mờ đi, và trong đầu chỉ văng vẳng **một câu hỏi** — không phòng ốc, không ai nói gì, không hình ảnh nào.\n\nBiểu hiện ra ngoài thì mỗi lúc mỗi khác — đôi khi là nhìn xa xăm, đôi khi là đang nói dở câu thì ngừng, đôi khi chẳng có biểu hiện gì cả, chỉ tự nhiên thấy mình đang lặp lại một câu trong đầu.\n\nGặp câu hỏi trần thì nhịp 1 trả lời bằng chính câu ấy, đừng cố dựng ra một cảnh không có. Rồi rẽ hai đường, tùy **câu hỏi ấy có nóng không**:\n\n| Loại | Dấu hiệu | Làm gì |\n|---|---|---|\n| **Câu hỏi nóng** | Đọc lên là thấy nặng ngay | **Nhảy thẳng nhịp 3.** Đối tượng nằm sẵn trong câu |\n| **Câu hỏi khô mà dai** | Nghe như câu hỏi kỹ thuật, lẽ ra tra một cái là xong — mà cứ trồi lên hoài | **Bắt buộc qua nhịp 2.** Nó đang đứng thay cho câu khác |\n\n**Câu hỏi nóng — đọc thẳng ra đối tượng:**\n\n| Câu trong đầu | Đối tượng |\n|---|---|\n| *Rồi mình sống bằng gì?* | kế sinh nhai của mình |\n| *Bố còn sống được bao lâu nữa?* | thời gian còn lại với bố |\n| *Mình đang sống vì cái gì?* | cái mình lấy làm chỗ dựa |\n| *Mình có đang phí đời không?* | hướng đi của mình |\n\n**Câu hỏi khô mà dai — phải hỏi tiếp mới ra:**\n\n| Câu trong đầu | Đọc thẳng thì ra | Hỏi tiếp *sợ gì, lo gì* thì lòi ra |\n|---|---|---|\n| *Có nên bán không?* | khoản đầu tư đang cầm | *Sợ mình lại quyết sai như lần trước* → **khả năng ra quyết định của mình** |\n| *Làm sao để con tự lập được?* | cách nuôi dạy con | *Sợ mình là ông bố hỏng* → **hình ảnh của mình trong vai người bố** |\n| *Bao giờ nó mới trả lời mình?* | tin nhắn đang chờ | *Lo nó không còn coi mình ra gì* → **chỗ đứng của mình với nó** |\n| *Mai họp nên nói thế nào?* | phần trình bày ngày mai | *Sợ bị hỏi câu không trả lời được* → **hình ảnh của mình trước phòng** |\n\n📌 **Dấu để nhận ra câu hỏi mồi: khô mà dai.** Câu hỏi kỹ thuật thật thì tra một cái là xong, không trồi lại. Còn nó cứ quay lại hoài nghĩa là nó đang đứng thay cho một câu khác — và câu ấy mới là câu phải bóc.\n\n### Nhịp 2 — khuôn câu\n\nMột cảnh nói lên nhiều thứ, chỉ **một** thứ chạm được vào cảm xúc. Đặt bút vào một khuôn rồi viết tiếp cho hết câu:\n\n| Khuôn | Nó đang là gì |\n|---|---|\n| **sợ rằng… · lo rằng…** | cái giá chưa tới mà đã trả trước |\n| **mong rằng… · hy vọng rằng…** | kỳ vọng hướng về phía trước |\n| **bực mình vì… · tiếc rằng…** | cái đã xảy ra rồi |\n| **lẽ ra là… · phải là…** | kỳ vọng ngầm vừa lộ mặt |\n| **bực / thất vọng / tự hào / ngạc nhiên — với chính mình, vì cái gì CỦA BẢN THÂN** | cảm xúc trỏ vào trong; thiếu ba chữ *của bản thân* thì câu trượt ra ngoại cảnh |\n| **thấy ra là…** | không còn là cảm xúc — đây là bài học, cảnh thường thôi trồi sau đó |\n\nHọ khuôn *với chính mình* chạy cả hai chiều: bực, xấu hổ thì lộ ra thứ cần **sửa**; tự hào, ngạc nhiên thì lộ ra thứ cần **nuôi** — mà thứ cần nuôi hầu như không bao giờ tự trồi lên, nên bắt được lúc nó trồi thì đừng để trôi.\n\n### Nhịp 3 — gạch chân, đừng nghĩ thêm\n\nĐối tượng nằm sẵn trong câu vừa viết. Chỉ việc gạch chân, và gạch cho đủ hai phần:\n\n> **[cái gì] CỦA [ai / cái gì]**\n\n| Câu ở nhịp 2 | Đối tượng |\n|---|---|\n| Lo rằng cả phòng nghĩ mình làm ẩu | **hình ảnh của mình** trong mắt đồng nghiệp |\n| Bực mình vì nó tiêu tiền kiểu đó | **cách tiêu tiền của người ta** |\n| Sợ rằng mai bị nói về việc gì đó | **việc sắp bị nói tới trong buổi gặp của sếp** |\n| Lẽ ra mình phải sửa nhà từ tháng trước | **lời hứa của bản thân** |\n| Bực với bản thân vì không có mặt lúc con hỏi | **cách có mặt của mình với con** |\n\nCái đứng trơ — *tiền, gia đình, bản thân* — thì chấm cái nào cũng ra đáng, nên chấm cũng như không. Đó chính là cái **thô**; vào việc nó mới mổ ra thành *cách tiêu tiền*, *bữa cơm chung của nhà mình*.\n\n⚠️ **Hai lối sai.** Dừng ở người — bóc ra \"chị Loan\" thì không chấm được, xử xong cảnh vẫn chạy lại. Hoặc trèo lên một bậc trừu tượng — từ *\"cả phòng nghĩ mình làm ẩu\"* nhảy sang \"chỗ đứng trong nghề\" là đi quá, cái nghề không có trong câu vừa viết.\n\n📌 Cái trồi lên không phải một việc chờ xử. Nó là **một đối tượng đang xin chỗ trong đầu**. Nên câu tiếp theo không phải *làm gì với nó* mà là *cái này có đáng suy nghĩ không* — đúng nhịp 4. Nhờ vậy mà chuyện chẳng liên quan gì tới mình vẫn chiếm chỗ chính đáng: chuyện chị Loan đối xử với bố mẹ thì mình không làm gì được, nhưng **quan hệ với bố mẹ** thì đáng để tâm.\n\n📌 **Tới được nhịp 2 đã là phần lớn rồi.** Đọc ra được câu chạm cảm xúc — *lo rằng…*, *lẽ ra phải…*, *thấy ra là…* — là đã biết mình đang ở đâu, và đó là phần khó nhất. Ba nhịp sau chỉ làm rõ thêm và xếp chỗ. Ngày nào chỉ tới được nhịp 2 thì ngày đó vẫn tính là làm.\n\n**Nhịp 4 và 5 — áng chừng là được.** Đáng thì tra danh sách đã chấm lúc yên; áp lực thì ước tại chỗ, vì nó đổi từng ngày. Muốn chấm kỹ bằng điểm số thì mở cuốn **Chấm**.\n\nDấu hiệu bóc chưa trúng: xử xong rồi mà cảnh vẫn chạy lại nguyên vẹn.\n\n### Chiều ngược — dựng phim cho cái đáng\n\n**Thước phim gợi lên bằng cảm xúc. Mà thứ đáng nhất thì cảm xúc rất mờ.** Không khí, giấc ngủ, cha mẹ — đáng bậc nhất mà chẳng chiếu cảnh nào. Chúng không trồi lên vì **chúng không có phim**. Còn ô 9 thì lúc nào cũng sẵn hình.\n\nNên với cái đáng, làm ngược: đã có đối tượng rồi thì **dựng phim** cho nó. Bốn mức, dựng tới đâu dùng tới đó — **thước phim** (thấy được cảnh) · **câu chuyện** (kể được thành lời) · **giả thiết** (*nếu mười năm nữa vẫn thế này thì sao?*) · **câu hỏi** (*lần cuối mình ăn cơm với bố mẹ mà không cầm điện thoại là bao giờ?*).\n\nTự dựng không ra thì mượn, ba bậc: chuyện người quanh mình · truyện, phim, sách · tự viết lấy. Cuốn **Cảm** trong bộ này là chất liệu bậc hai, dựng sẵn cho mấy đối tượng khó thấy nhất.\n\n### Hai bảng — trong vòng và ngoài vòng\n\nNhìn vế *của ai* mà chia:\n\n| | **TRONG** — của mình và vòng thân thiết | **NGOÀI** — của người ngoài vòng |\n|---|---|---|\n| Cảnh mang gì | Cảm xúc còn hoen: *sợ, lo, bực, tiếc* | Bài học: *thấy ra là…* |\n| Vì sao | Mình là một phía trong đó | Mình đứng ngoài, nhìn được cả cảnh |\n| Xử thế nào | Vào chín ô. Việc là **gỡ** | Không có gì để gỡ, có cái để **giữ** |\n\n📌 **Bảng NGOÀI là bộ lọc khách quan nạp cho ô 3.** Ô 3 khó nuôi vì hai cửa đều kẹt: cái tự trồi lên toàn cảm xúc vòng trong, còn dựng phim thì phải biết trước đối tượng. Bảng NGOÀI mở cửa thứ ba, ngược chiều — **bài học tới trước, đối tượng theo sau.** Thấy ông hàng xóm chăm mẹ già, rồi mới lòi ra *quan hệ với bố mẹ của mình* đang bỏ trống. Không phải trả giá bằng một lần hỏng việc.\n\nBa bước: ghi câu *\"thấy ra là…\"* nguyên văn → hỏi *chuyện này soi vào món nào của mình* → món soi ra được thì đem chấm.\n\n⚠️ Hai lối trôi sang bảng TRONG: **so đo** (bạn khoe chốt lãi → bực vì mình bỏ lỡ — ô 9) và **phán xét** (nghĩ mãi người ta đúng sai — ô 8). Dấu phân biệt: bài học thì viết xong là xong; hai cái kia viết xong vẫn trồi lên.\n\n### Năm cách tập\n\n1. **Check-in.** *Ngồi nằm là an, an là check-in; đi đứng nên là chánh niệm.* Ba nhịp thở rồi ba câu. Có gì thì ghi một dòng.\n2. **Đặt tay lên mồi.** Dán một chấm lên ốp điện thoại: *cầm lên để làm gì, hay để chạy khỏi cảnh nào?*\n3. **Viết ba phút buổi sáng.** Không dừng, không đọc lại. Đối tượng nào trồi ba buổi liên tiếp là món cần chấm.\n4. **Mỗi tuần dựng một cảnh** cho một món ô 3 đang mờ.\n5. **Mỗi tuần một câu \"thấy ra là\"** từ bảng NGOÀI, rồi hỏi nó soi vào món nào của mình.\n\n💡 Nếu cả cuốn này chỉ làm được một việc, làm việc số 1.\n\n⚠️ Nhận diện không phải phán xét. Thấy mình bực thì ghi \"bực\", đừng ghi \"mình lại bực nữa rồi, dở quá\" — câu thứ hai là một cuốn phim ô 8 mới vừa được bật.\n\n---\n\n## 2. Bốn động tác và hai luật cửa vào\n\nChín ô đều xài chung bốn động tác này.\n\n**1. VIẾT RA.** Cái gì thành chữ thì thôi trồi lên — đầu chỉ buông khi món đó nằm ở một chỗ đáng tin.\n\n💡 **MẸO:** Trên bàn để một tờ **DANH SÁCH CHỜ**. Đang làm mà món nào nhảy vô đầu — ghi một dòng, quay lại việc. Ghi tức là hẹn: biết rồi, tới lượt sẽ gọi.\n\n**2. ĐÓNG.** Việc xong mà chưa đóng thì vẫn chiếm chỗ. Ba nghĩa, hay quên nghĩa thứ ba: với việc — báo xong, gửi đi, bàn giao. Với chuyện trong lòng — viết đúng câu *\"cái này không có gì để làm thêm\"*, vì đầu chỉ thôi tìm giải pháp khi có xác nhận là hết đường tìm. Với cái căng còn lại trong người — đi bộ, vận động, hoặc kể cho một người nghe; cơ thể không đọc email, gửi email đi rồi nó vẫn chưa biết là xong.\n\n**3. HẠ GIÁ.** Cùng một việc: phải **nhớ** thì đắt, vào **lịch** thì rẻ, thành **thói quen** thì gần miễn phí, **giao được** thì khỏi tính. Giao việc bốn bước: giao **kết quả** (không giao cách làm) · kèm **hạn** · kèm mức **\"đủ\"** · hẹn một mốc **kiểm giữa chừng**. Thiếu một trong bốn thì việc quay về đầu bạn kèm lãi.\n\n**4. THẾ CHỖ.** Dọn thứ gì ra thì phải có thứ đáng lấp vào. Chỗ trống bỏ trống là thằng cũ về đòi lại.\n\n**Hai luật cửa vào** — áp cho mọi thứ vừa tới:\n\n**Luật 2 phút:** dưới 2 phút thì làm ngay, không ghi. Ghi một việc 2 phút tốn hơn làm nó.\n\n**Luật chạm một lần:** đã mở ra thì quyết luôn một trong bốn — làm ngay (nếu <2 phút) · vào lịch hoặc danh sách · giao đi · xóa. Mở rồi đóng \"để tính sau\" là trả tiền đọc lại từ đầu, và món đó thành một dòng nữa trong hàng chờ.\n\n---\n\n## 3. Ba ô rất đáng — 1 xử lý, 2 và 3 sinh lợi\n\n### Ô 1 · Rất áp lực × Rất đáng — ĐÓNG CỬA TẬP TRUNG\n\n1. Ngắt hết kết nối, báo người xung quanh: đang bận.\n2. Giấy bút: viết chính xác vấn đề.\n3. Viết điều tệ nhất có thể xảy ra — và nếu xảy ra thì làm gì.\n4. Chọn việc nhỏ nhất làm được trong 15 phút. Làm luôn.\n5. Không viết nổi: gọi một người, nói ra miệng.\n6. Vẫn tắc: **hạ áp chứ đừng cố nghĩ nhanh** — xin lùi hạn, cắt phạm vi. Hạ được thì nó rơi xuống ô 2.\n7. Xong: đóng — báo với người liên quan, rồi đóng nốt trong người (đi bộ, kể lại cho ai đó).\n\n### Ô 2 · Áp lực × Rất đáng — DỰ ÁN THỰC THI\n\nÁp lực đúng liều: đủ để chân bước, chưa đủ để hỏng đầu. Đây là ô người ta lớn lên trong đó.\n\nChữ **thực thi** để tách nó khỏi ô 6. Món còn đang hỏi *có đáng không* thì nằm ô 6, đó là giai đoạn dò. Sang ô 2 là khi đã biết nó đáng và đã biết làm gì — chỉ còn việc làm cho xong.\n\n1. Viết vấn đề trong một câu.\n2. Hai ba phương án, kể cả *không làm gì*.\n3. Giá từng phương án.\n4. Chọn một, **viết lý do trong một câu** — để khỏi quay lại cân nhắc lần nữa.\n5. Đặt vào **khối giờ** cụ thể trên lịch (mục 8). Chưa có ngày giờ là đầu còn ôm.\n6. Việc lớn thì **cắt lát**: viết sẵn lát đầu tiên cỡ 15 phút, để buổi hẹn mở ra là chạy ngay.\n7. **Hỏi câu cuối, hai nhánh:**\n\n   > **Xong thì để lại NẾP gì?**\n   > **Hoặc: nó đổi BỐI CẢNH nào, cho nếp nào chạy dễ hơn?**\n\n   Nhánh một dựng ra một nghi thức mới — đi khám xong thì để lại nếp khám định kỳ. Nhánh hai giữ nguyên nghi thức đã có mà làm cho nó rẻ đi: dự án sửa phòng ngủ cho tối và mát, dự án dọn góc làm việc, dự án đổi đường đi làm cho khỏi ngang tiệm cà phê.\n\n   Nhánh hai thường bền hơn, vì **bối cảnh không cần ai duy trì** — phòng ngủ tối thì nó tối mỗi đêm, không phụ thuộc hôm nay mình có quyết tâm hay không. Không được nhánh nào thì xem lại: có khi nó là ô 4.\n8. Đóng sổ tới giờ hẹn.\n\n### Ô 3 · Không áp lực × Rất đáng — NỀ NẾP THÔNG MINH ⭐\n\nÔ quý nhất, và dễ mất nhất — vì không có gì thúc nó, nên nó thua mọi thứ có hạn, năm này qua năm khác.\n\n⚠️ **COI CHỪNG:** Đối thủ trực tiếp của ô 3 là ô 8 và ô 9 — cả ba tranh cùng một tài nguyên: khe rảnh. Dọn hai ô kia được bao nhiêu, ô 3 được bấy nhiêu.\n\nVì không có gì thúc, bạn tự chế đồ thúc:\n\n1. **Đặt vào giờ vàng** — 1–2 tiếng đầu óc tốt nhất trong ngày (đo ở mục 7). Khối đó dành riêng cho ô 3: cấm họp, cấm tin nhắn. Giờ vàng đem trả lời email là phí nhất trong mọi cái phí.\n2. **Dở dang cố ý** — dừng buổi làm ở chỗ đang trớn, đừng kết thúc tròn trịa. Cái chưa xong tự gọi bạn quay lại; cái đã xong thì im.\n3. **Chuỗi nhìn thấy được** — kẻ ô lên giấy dán chỗ hay nhìn, mỗi ngày đủ phần tô một ô. Tiếc chuỗi mạnh hơn mọi lời tự hứa.\n4. **Dọn sẵn** — tối để sẵn thứ cần cho phiên mai: tập mở đúng trang, bút gác lên, giày để cửa.\n5. **Ma sát ngược** — hạ ma sát cho ô 3 (mở ra là làm được ngay), dựng ma sát cho ô 9.\n6. **Hồi đáp** — gửi thành quả cho một người mỗi tuần. Có người chờ là có động cơ.\n7. **Kéo cái giá lại gần** — ô 3 không áp lực vì cái giá của nó ở xa và mờ, dù rất lớn. Làm nó hiện ra: viết câu *\"bỏ cái này mười năm thì mất gì\"* dán cạnh chỗ làm; người bỏ tập thì đi khám một lần cho biết số; người ít gọi về nhà thì tính xem còn gặp được bố mẹ chừng bao nhiêu lần nữa. Cái giá hiện ra thì ô 3 tự có áp lực, khỏi cần ép mình.\n8. Ô này là ô duy nhất: khi nó tự trồi lên lúc rảnh, **nuôi**, đừng buông.\n\n#### Nghi thức — cách làm nếp bám chắc nhất\n\nBảy đồ thúc ở trên là bảy mẹo rời. Muốn một món ô 3 bám chắc thật thì đừng nhớ bảy mẹo — **dựng cho nó một nghi thức.**\n\nNghi thức khác mẹo ở ba chỗ. Nó **bám vào một chuyển cảnh** cố định, nên khỏi phải nhớ lúc nào làm. Nó có **mở — thân — đóng**, nên bắt đầu là chạy hết, không dừng giữa chừng. Và nó **không cần chọn**: đúng cái mà cả cuốn sách này nhắm tới, vì lúc mệt người ta không chọn nổi.\n\nDựng một nghi thức, bốn phần:\n\n| Phần | Là gì | Ví dụ — nếp đọc buổi tối |\n|---|---|---|\n| **Cửa** | Chuyển cảnh nào châm ngòi | Rửa bát xong, tắt bếp |\n| **Mở** | Một động tác nhỏ, luôn giống nhau | Rót một ly nước, tắt đèn trần bật đèn bàn |\n| **Thân** | Việc chính | Đọc, không đặt mục tiêu bao nhiêu trang |\n| **Đóng** | Dấu chấm hết, cũng luôn giống nhau | Gấp sách để lên gối — mai mở ra là thấy |\n\n**Mở và đóng quan trọng hơn thân.** Thân thì ngày dài ngày ngắn, có hôm mười phút có hôm một tiếng — không sao. Nhưng mở mà bỏ thì hôm ấy coi như không có nếp; đóng mà bỏ thì nó không khép lại, và cái không khép thì còn chiếm chỗ.\n\n💡 **Động tác mở nên rẻ tới mức không từ chối được.** Rót một ly nước, xỏ giày, mở đúng một trang. Người mệt không cãi được với một động tác mười giây, mà xỏ giày rồi thì thường đi luôn.\n\n⚠️ **Đừng dựng nghi thức cho nhiều món cùng lúc.** Một món, tới khi nó chạy mà không phải nghĩ, rồi mới sang món sau. Dựng ba cái một lúc thì cả ba thành ba việc phải nhớ — tức là quay về mẹo.\n\n📌 Đây cũng là chỗ ô 2 giao cho ô 3. Câu cuối của một dự án ô 2 — *xong thì để lại nếp gì?* — trả lời đầy đủ nghĩa là: để lại một **nghi thức**, có cửa, có mở, có đóng. Không có bốn phần ấy thì cái \"nếp\" chỉ là một lời hứa với chính mình.\n\n---\n\n## 4. Hai ô đáng vừa và kho giá trị ẩn — 4 và 5 xử lý, 6 sinh lợi\n\n### Ô 4 · Rất áp lực × Đáng — NGHĨ ĐỦ RỒI THÔI\n\n1. Hỏi trước: *không làm thì sao?* Đáp được \"chẳng sao mấy\" → nó là ô 7.\n2. Định nghĩa \"đủ\" trước khi làm. Dừng đúng đó, không đánh bóng.\n3. Hạn cứng tự đặt — 30 phút, hết giờ là nộp.\n4. Lần thứ ba gặp cùng loại: **quy trình hóa** — viết một lần, dùng nhiều lần.\n5. Xong, đóng, cấm nghĩ lại.\n\n### Ô 5 · Áp lực × Đáng — GOM MỘT MẺ\n\n1. Một danh sách duy nhất, không rải chín chỗ.\n2. Gom theo loại, xử một mẻ trong một khối giờ cố định mỗi tuần.\n3. Trước khi làm, rà: món tự hết hạn thì gạch. Phần lớn ô 5 tự chết nếu để yên một tuần — và không ai thiệt.\n4. Món cần người khác quyết: hỏi ngay hôm nay, đừng ủ.\n\n### Ô 6 · Không áp lực × Đáng — NGHIÊN CỨU VÀ TRẢI NGHIỆM\n\nÔ này chứa một loại duy nhất: **món rẻ mà giá trị chưa hiện ra.** Cuốn sách ai đó giới thiệu, người bạn cũ lâu không gặp, chuyến đi chưa biết đi đâu, một cách làm mới, một câu hỏi muốn tìm hiểu.\n\nHai chữ trong tên là hai kiểu thử. **Nghiên cứu** — tìm hiểu để biết: đọc về cách dựng nghi thức, hỏi người đã làm rồi, tìm hiểu một phương pháp. **Trải nghiệm** — làm để biết: đọc cuốn sách ấy, đi chuyến ấy, gặp lại người ấy. Nhiều món cần cả hai, nghiên cứu trước rồi trải nghiệm sau.\n\nGiá trị của chúng **chưa lộ mặt**, và nhìn thì không bao giờ lộ. Cuốn sách nào cũng có thể là cuốn đổi cách nghĩ của mình, hoặc là cuốn phí một buổi tối. Gặp lại bạn cũ có khi mở ra một chuyện, có khi ngồi hai tiếng chẳng có gì. Chỉ làm mới biết.\n\n📌 **GHI NHỚ — luật của ô này là THỬ, không phải chờ.** Cái mất khi thử có đáy: một khe rảnh, một buổi tối, mẫu số 2 tới 4. Cái được thì không có trần. Nên không thử là bỏ hết phần đuôi dài — mà phần đuôi ấy chính là chỗ mọi thứ tốt bất ngờ đi ra.\n\n**Cách làm:**\n\n1. **Danh sách riêng tên SỔ THỬ.** Không trộn với ô 3, ô 5. Nó trồi lên giữa lúc bận thì ghi vào rồi buông — *có tên rồi, tới đợt gặp.*\n2. **Không đặt lịch, không đặt hạn.** Đặt là nó giả dạng ô 5 và bắt đầu ép.\n3. **Mỗi tháng rà một lần, và rà là để chọn một món đem thử** — không phải để nhìn rồi cất lại. Chọn món nào rẻ nhất mà tò mò nhất.\n4. **Thử xong thì hỏi: còn gì chưa dò không?** Ba đường:\n\n| Sau lần thử | Nghĩa là | Làm gì tiếp |\n|---|---|---|\n| **Ra hướng** — hé ra cái gì đó, và cái hé ra chỉ tiếp một chỗ chưa dò | Tử số vừa nhích lên, mẫu số vẫn rẻ | **Đầu tư nặng hơn** lần sau. Ra hướng mạnh thì kéo lên ô 2 |\n| **Không ra gì, mà chưa dò hết** — mới thử một cách, còn mấy cách khác | Chưa đủ mẫu để kết luận | Thử tiếp **một cách khác**, đừng làm lại cách cũ |\n| **Không ra gì, và đã dò hết** — hết đường thử | Đủ căn cứ | **Gạch.** Gạch có căn cứ, không tiếc |\n\n⚠️ **COI CHỪNG — bỏ luật \"ba lần thì gạch\".** Đếm số lần *nhìn* là đếm sai thứ: nhìn không sinh ra thông tin mới, lần nào cũng như lần nào, nên gạch sau ba lần nhìn là kết luận về xác suất mà chưa lấy một mẫu nào. Cái quyết định không phải bao nhiêu lần, mà là **tiềm năng còn lại** — sau mỗi lần thử, phần chưa lộ ra còn bao nhiêu. Còn chỗ chưa dò thì giữ, dù đã thử năm lần. Hết chỗ chưa dò thì gạ
