ch, dù mới thử một lần.\n\n💡 **MẸO — món nhặt từ bảng NGOÀI.** Một câu *\"thấy ra là\"* nhiều khi phải nằm trong kho vài tháng mới lòi ra nó soi vào món nào của mình. Với loại này, \"thử\" nghĩa là mang nó ra soi vào một chỗ cụ thể trong đời mình, chứ không phải đọc lại nó.\n\n📌 **GHI NHỚ — ô 6 là chỗ nhiều đòn bẩy nhất trong chín ô.** Ô 3 biết trước là đáng, nên nó chắc mà không bất ngờ. Ô 6 thì không biết trước — và đúng vì không biết trước nên nó là ô duy nhất còn có thể cho ra một thứ rất đáng mà mình chưa hề nghĩ tới. Món nào thử ra hướng thì đường của nó là **ô 6 → ô 2 → ô 3**: từ một món đem thử thành dự án, từ dự án thành nề nếp.\n\n---\n\n## 5. Ba ô không đáng — cả ba là dọn dẹp\n\n### Ô 7 · Rất áp lực × Không đáng — TRẢ VỀ ĐÚNG CHỦ\n\n⚠️ **COI CHỪNG:** Ô nguy hiểm nhất. Vì rất áp lực nên nó tự xưng là quan trọng, và bạn phục vụ nó trong khi tưởng mình đang làm việc.\n\n1. Câu đầu tiên: *cái ép này của ai?* Phần lớn ô 7 là áp lực của người khác chảy sang bạn.\n2. *Không làm thì ai thiệt, thiệt bao nhiêu?* Trả lời thật thì một nửa tự rụng.\n3. Còn lại: từ chối · trả về đúng người · hoặc làm ở mức thấp nhất chấp nhận được.\n4. Từ chối **một câu**, ba mẫu dùng liền:\n   - Hẹn cửa: *\"Gửi vào [chỗ X] giùm, chiều thứ Sáu tôi xử một lượt.\"*\n   - Trả về: *\"Việc này của [A] quyết, anh hỏi thẳng [A] nhanh hơn.\"*\n   - Thẳng: *\"Tuần này tôi kín, không nhận thêm được.\"*\n   Giải thích dài là mở cửa cho nó quay lại.\n5. **Đặt cữ liên lạc:** email, tin nhắn xem theo cữ 2–3 lần một ngày, ngoài cữ tắt thông báo. Ai gấp thật sẽ gọi điện — và bạn sẽ ngạc nhiên vì gần như không ai gọi.\n6. Một tuần ba lần cùng một nguồn → không phải ba món, là **một cái van hỏng**. Sửa van, đừng hứng nước.\n\n### Ô 8 · Áp lực × Không đáng — HẸN GIỜ MÀ NGHĨ\n\nChuyện chưa nguôi, câu nói hôm qua, việc xong chưa ai công nhận. Không hạn, không ai đòi — mà chạy nền suốt, ăn đúng khe rảnh của ô 3.\n\n1. **Viết ra bằng chữ.** Bắt buộc — cái chưa có hình dạng thì trồi lên mãi.\n2. Phân đôi: **có việc để làm** hay **không có việc nào?**\n3. Có việc → làm việc *nhỏ nhất* đóng được nó: nói một câu, gửi một tin, hỏi cho rõ. Xong là đóng.\n4. Không có việc → viết đúng câu: *\"cái này không có gì để làm.\"*\n5. **Hẹn giờ nghĩ:** cấp cho nó một khối 30 phút cố định mỗi tuần. Ngoài giờ, nó trồi lên: *có hẹn rồi.* Cấm nghĩ thì nó chạy nền cả ngày; hẹn giờ thì nó chịu chờ.\n6. Ba tuần vẫn nguyên: nói với một người — ô này cần lỗ tai hơn cần giải pháp.\n7. Nhiều tháng, ngày càng nặng: không còn là ô 8 — gặp người có nghề. Nghiêm túc.\n\n### Ô 9 · Không áp lực × Không đáng — XÓA VÀ DỰNG RÀO\n\n1. Xóa. Không \"để dành coi sau\".\n2. Xóa rồi vẫn về? Nó không phải một món — nó là **thói quen**. Đừng đấu tay đôi từng lần.\n3. Dựng ma sát: điện thoại phòng khác · gỡ app khỏi màn hình chính · đăng xuất. Mỗi nấc ma sát chặn một nửa số lần.\n4. **Thế chỗ:** khe vừa dọn phải có sẵn món ô 3 lấp vào, không thì tuần sau đâu lại vào đấy.\n\n📌 **GHI NHỚ:** Bạn không thua ô 9 vì thiếu ý chí. Bạn tay không đấu với một đội được trả lương để giữ bạn ở lại. Đừng đấu — đổi đường đi.\n\n---\n\n## 6. Một tối thứ Năm — chạy thử cả hệ\n\n**Bối cảnh:** chị Hà, kế toán, hai con. Tám giờ tối thứ Năm, ngồi vào bàn định làm nốt việc, mà hai mươi phút chưa gõ được chữ nào.\n\n**Bước 1 — Nhìn ra có món (mục 1).** Chị để ý tay mình cầm điện thoại lần thứ tư trong hai mươi phút. Nhớ dấu hiệu: *thèm cầm điện thoại thường là đang chạy khỏi cái gì đó.* Chị đặt máy xuống, lấy giấy: nãy giờ trong đầu mình có cái gì?\n\nRa năm món: bảng lương phải xong trước sáng thứ Hai · câu chị Loan nói trong họp chiều nay, nghe như đá xoáy · con lớn tuần sau họp phụ huynh · định đi khám sức khỏe từ tháng Ba, giờ là tháng Chín · cái khóa tiếng Anh online ai đó giới thiệu.\n\n**Bước 2 — Chấm và xếp ô (hai cái thước).** Tối thứ Năm không ai ngồi chấm kỹ từng cặp, từng câu — chị áng chừng:\n\n| Món | Áp lực? | Đáng? | Ô |\n|---|---|---|---|\n| Bảng lương | Rất — thứ Hai, sai là rắc rối thật | Đáng — xong là hết, không nuôi thêm gì | **4** |\n| Hình ảnh trong mắt đồng nghiệp | Có — không ai đòi, mà cứ trồi lên | Không — cứ nghĩ mãi thì hồn chết dần | **8** |\n| Họp phụ huynh | Có — có ngày rồi | Rất — con, thiếu thì chết một mảng | **2** |\n| Đi khám | Không — chưa thấy cái giá nào | Rất — thiếu thì thân chết dần | **3** |\n| Khóa tiếng Anh | Không | Đáng | **6** |\n\nChị nhận ra: món **duy nhất** làm chị ngồi hai mươi phút không gõ được chữ nào là món số 2 — không gấp, không đáng, không ai đòi. Mà chiếm chỗ nhiều nhất. (Lúc chạy năm nhịp chị mới bóc được nó — xem bước 3.)\n\n**Bước 3 — Xử theo ô.**\n\n*Ô 8 trước, vì nó đang chắn đường.* Chị chạy năm nhịp:\n\n*Cảnh gì* — chị Loan nói trước phòng là số của mình \"chắc lại phải kiểm tra lại\".\n*Câu chuyện chạm đến cảm xúc* — chị thử mấy khuôn. \"Bực mình vì chị Loan nói móc\" — viết ra thấy không đúng lắm. \"Lo rằng cả phòng nghĩ mình làm ẩu\" — đúng cái này, viết xong thấy nghẹn ngay. Còn một câu nữa trồi lên: \"lẽ ra chị Loan phải hỏi riêng mình trước\" — đó là một kỳ vọng ngầm, ghi lại để đó.\n*Đối tượng chính* — đọc thẳng từ câu vừa viết: **hình ảnh của mình trong mắt đồng nghiệp.** Không phải chị Loan, cũng không phải cái nghề.\n*Có đáng suy nghĩ không* — có, và đáng nhiều.\n*Có gây áp lực không* — có, mà vừa: không ai đòi gì, chỉ cứ trồi lên.\n\nBóc trúng thì việc phải làm đổi hẳn. Nếu dừng ở chị Loan, việc là đi hỏi chị ấy có ý gì — hỏi xong có khi vẫn nghẹn. Bóc tới đối tượng thật thì việc là nói cho rõ với những người đã ngồi nghe. Chị ghi vào Danh sách chờ: *sáng mai gửi cả phòng bản đối chiếu, kèm một câu.* Cái nghẹn nhẹ hẳn — không phải vì đã giải quyết, mà vì nó có chỗ rồi.\n\n*Ô 4 — bảng lương.* Định nghĩa \"đủ\": số đúng, không cần đẹp bảng biểu. Hạn cứng: sáng thứ Sáu, chín tới mười một giờ. Không làm tối nay.\n\n*Ô 2 — họp phụ huynh.* Hai phương án: xin nghỉ nửa buổi, hay nhờ chồng. Chọn tự đi, lý do một câu: \"con vừa đổi lớp, mình cần gặp cô một lần.\" Nhắn chồng, ghi vào lịch. Xong, khỏi nghĩ lại.\n\n*Ô 3 — đi khám.* Không có gì thúc, nên chị kéo cái giá lại gần: gọi đặt lịch khám ngay tối đó, cho một ngày cụ thể. Ba phút.\n\n*Ô 6 — khóa tiếng Anh.* Ghi vào SỔ THỬ. Không tìm hiểu thêm tối nay. Tháng sau rà sổ, nếu chọn tới nó thì học thử một buổi rồi mới quyết.\n\n**Bước 4 — Còn lại gì.** Chín giờ tối, trên giấy còn đúng một dòng cho tối nay: *không có việc gì phải làm tối nay.* Chị đi ngủ sớm. Sáng thứ Sáu làm bảng lương trong hai tiếng, xong.\n\n📌 **GHI NHỚ:** Chú ý cái *không* xảy ra: chị Hà không làm thêm việc nào cả — mười lăm phút viết và một cuộc gọi ba phút. Cái đổi không phải làm được nhiều hơn. Cái đổi là năm món đang chen nhau thành năm món nằm đúng chỗ, và món chắn đường nhất — món không gấp, không đáng — được gỡ ra trước.\n\n⚠️ **COI CHỪNG:** Đừng đợi làm gọn được như ví dụ. Lần đầu ai cũng xếp sai vài món và bỏ sót món to nhất. Xếp sai vẫn hơn để chúng nằm lẫn lộn trong đầu.\n\n---\n\n## 7. Tự đo ba ngày\n\nChỗ trong đầu không có gì báo khi bị chiếm — muốn thấy thì phải tự đo. Ba ngày, một tờ giấy:\n\n1. Kẹp tờ giấy mang theo người.\n2. Mỗi lần **đổi việc** hoặc **bị cắt ngang**: gạch một vạch, ghi một chữ cho biết ai cắt — *tin nhắn / người / tự nhớ ra / thông báo*.\n3. Mỗi lần bắt gặp mình nghĩ lại một chuyện **đã nghĩ rồi** trong ngày: ghi tên chuyện đó.\n4. Mỗi tối, một dòng: *hôm nay mệt nhất lúc mấy giờ, và sau lúc đó mình làm gì?*\n\nSau ba ngày, đọc ra bốn thứ, mỗi thứ chỉ thẳng một chỗ:\n\n- **Ai cắt ngang nhiều nhất** → cái van của ô 7. Sửa nó trước, sửa một được nhiều.\n- **Chuyện nghĩ đi nghĩ lại nhiều nhất** → ô 8 của bạn. Đặt giờ hẹn nghĩ cho đúng nó.\n- **Khung giờ ít vạch nhất** → giờ vàng của bạn. Giao cho ô 3.\n- **Sau lúc mệt nhất bạn thường làm gì** → thứ đang gần tay nhất lúc cạn pin. Nếu là ô 9: dựng ma sát chỗ đó trước tiên, và lấp khe đó bằng một món ô 3 đã dọn sẵn.\n\n💡 **MẸO:** Ba ngày đo thì đừng sửa gì. Vừa đo vừa sửa thì số sai, và bạn sẽ tưởng mình ổn hơn thực tế.\n\n---\n\n## 8. Khối giờ — lịch tuần mặc định\n\nNguyên tắc: **thứ gì đáng thì có chỗ trên lịch trước khi tuần bắt đầu.** Không đặt trước thì thứ rất áp lực tự lấy hết.\n\n| Khối | Bao nhiêu | Đặt ở đâu |\n|---|---|---|\n| **Ô 3 — giờ vàng** | 1–2 tiếng × 4–5 ngày | Đúng giờ vàng đo ở mục 7. Bất khả xâm phạm |\n| **Ô 5 — mẻ lặt vặt** | 1 khối/tuần | Giờ đầu óc kém nhất — lặt vặt không cần đầu tốt |\n| **Ô 8 — giờ hẹn nghĩ** | 30 phút/tuần | Chiều muộn một ngày cố định, sau đó có việc dễ chịu |\n| **Cữ liên lạc** | 2–3 cữ/ngày, mỗi cữ 20–30 phút | Sau khối ô 3, không bao giờ trước |\n| **Đệm** | Chừa trống ~20% lịch | Rải đều — để hứng ô 1 phát sinh |\n\n⚠️ **COI CHỪNG:** Khối đệm là khối hay bị bỏ nhất và gây sập hệ nhiều nhất. Lịch kín 100% thì một việc ô 1 phát sinh sẽ đè lên đúng khối ô 3 — vì đó là khối duy nhất \"dời được mà không ai kêu\". Dời một lần là thành lệ.\n\n**Luật một cuốn lịch:** mọi thứ có ngày giờ nằm trên đúng một cuốn lịch. Hai lịch là hai chỗ để quên.\n\n---\n\n## 9. Buổi rà tuần — 30 phút\n\nChốt cả hệ. Một buổi cố định (nhiều người chọn chiều Chủ nhật). Chín bước, chia hai nửa: **nửa đầu dọn, nửa sau sinh lợi.**\n\n**Nửa dọn — bốn bước**\n\n1. **Trút** — mọi thứ đang lởn vởn trong đầu ra Danh sách chờ. Hai phút, viết không chọn lọc.\n2. **Chấm** — món mới nào đáng chấm thì chấm, xếp ô.\n3. **Mổ** — tuần qua có mục thô nào bị vào việc mổ ra thành nhánh không? Ghi nhánh mới, chấm riêng từng nhánh. Mục nào chấm giữa cơn thấy khác hẳn lúc tỉnh thì sửa lại điểm ở đây.\n4. **Gạch** — rà danh sách ô 5, món tự hết hạn thì gạch. Rà ô 7 và ô 9: nguồn nào lặp lại ba lần tuần qua thì sửa van, đừng hứng từng ca nước.\n\n**Nửa sinh lợi — năm bước**\n\n5. **Đếm** — nhánh nào trồi lên nhiều nhất tuần qua? Con số đó đáng tin hơn điểm chấm, vì nó đo được chứ không phán đoán.\n6. **Rà bảng NGOÀI** — mấy câu \"thấy ra là\" nhặt được tuần qua soi vào món nào của mình? Món nào ra rất đáng mà không ép gì cả thì đó là ô 3 mới.\n7. **Rà SỔ THỬ (ô 6)** — mỗi tháng một lần: chọn một món đem thử. Món đã thử rồi thì hỏi *còn gì chưa dò không* — còn thì giữ và đầu tư nặng hơn, ra hướng mạnh thì kéo lên ô 2, hết chỗ dò thì gạch.\n8. **Đặt khối** — kéo lịch tuần mặc định vào tuần tới, điền món cụ thể vào từng khối ô 3 và từng bước ô 2.\n9. **Chọn ba** — ba món của tuần, lấy từ ô 2 và ô 3. Ba, không phải bảy. Rồi **đóng tuần cũ**: việc nào xong mà chưa báo xong thì báo nốt.\n\n📌 **GHI NHỚ — nửa sau mới là chỗ buổi rà đáng làm.** Nửa dọn giữ cho hệ khỏi tắc, nhưng dọn xong chỉ về mức không. Nửa sinh lợi mới sinh ra cái mới: bước 6 tìm ô 3 mới, bước 7 thử một món chưa biết giá trị, bước 8 và 9 đẩy ô 2 chạy tiếp. Tuần nào cạn giờ thì cắt nửa đầu, đừng cắt nửa sau.\n\n💡 **MẸO — quy tắc 20/80, sau khi đã chấm ~50 món:** xếp theo điểm Đáng, nhìn hai đầu. Nhóm 20% trên cùng gánh phần lớn giá trị đời bạn → phải chiếm giờ vàng. Nhóm 20% dưới cùng ăn phần lớn chỗ trong đầu → xử trước tiên, đúng ô từng đứa.\n\n---\n\n## 10. Mười lỗi người mới hay mắc\n\n1. **Chấm Đáng giữa cơn ép.** Giữa cơn, cái gấp luôn thắng. Chấm ở buổi rà tuần; giữa cơn chỉ tra.\n2. **Dọn ô 9 mà không thế chỗ.** Tuần sau về nguyên trạng. Luôn có món ô 3 lấp sẵn.\n3. **Đặt hạn cho món trong SỔ THỬ.** Vừa đặt hạn là nó giả dạng ô 5 và bắt đầu ép bạn. Muốn nó chạy thì đem ra thử, không phải đặt hạn cho nó.\n4. **Từ chối kèm ba dòng giải thích.** Mỗi dòng giải thích là một cái quai để người ta nắm kéo lại. Một câu.\n5. **Lịch kín 100%.** Không đệm thì ô 1 phát sinh sẽ ăn khối ô 3. Chừa 20%.\n6. **Giờ vàng đem trả lời email.** Giờ đầu óc tốt nhất thuộc về ô 3. Email xếp vào giờ đầu óc xoàng.\n7. **Cấm mình nghĩ chuyện ấm ức.** Cấm thì nó chạy nền cả ngày. Hẹn giờ thì nó chờ.\n8. **Việc xong không báo xong.** Chưa đóng là còn chiếm chỗ, dù xong từ tuần trước.\n9. **Xử ô 7 từng món một.** Ba lần cùng nguồn là van hỏng — sửa van, đừng hứng từng ca nước.\n10. **Đọc xong định bụng \"lúc nào rảnh sẽ áp dụng.\"** Không có lúc nào rảnh — chính vì thế mới cần cuốn này. Bước một làm ngay, hai phút: lấy tờ giấy, viết DANH SÁCH CHỜ lên đầu trang, đặt lên bàn.\n\n---\n\n## 11. Sổ tay — gom hết chuyện viết vào một chỗ\n\nCả bộ, chỗ nào cũng bảo viết. Mục này gom lại để khỏi phải nhớ.\n\n**Vì sao viết lại chạy:** không phải để nhớ — để **thôi phải nhớ**. Đầu chỉ buông khi món đó nằm ở chỗ đáng tin. Chữ có hình dạng, ý nghĩ thì không — cái không hình dạng thì đầu tự cho nó cỡ vô hạn. Và viết là chỗ xả rẻ nhất, làm được một mình, bất cứ lúc nào.\n\n**Bộ sổ tối thiểu** — một cuốn, chia bốn phần. Đừng dùng bốn cuốn: bốn cuốn là bốn chỗ để quên.\n\n| Phần | Đựng gì | Mở lúc nào |\n|---|---|---|\n| **1. Danh sách chờ** | Món vừa nhảy vào đầu, một dòng | Cả ngày |\n| **2. Sổ thử** | Ô 6 — kèm cột *đã thử cách nào, còn cách nào chưa dò* | Ghi khi có, rà mỗi tháng |\n| **3. Trang chấm** | Hai bảng — **TRONG** (của mình, vòng thân thiết) và **NGOÀI** (của người ngoài vòng). Mỗi dòng ghi *cái gì · của ai · ép · đáng · ô* | Buổi rà tuần |\n| **4. Trang nghĩ** | Ô 1, ô 2, ô 8 — chỗ viết dài | Khi cần nghĩ cho ra |\n\nCộng hai thứ **ngoài sổ**, vì phải nhìn thấy được: chuỗi tô ô dán trên vách, và lịch tuần ở chỗ bạn hay xem.\n\n**Bảng tra nhanh:**\n\n| Đang thấy | Mở trang nào, viết gì |\n|---|---|\n| Đầu rối, không biết bắt đầu từ đâu | Trang nghĩ — trút hết ra, không sắp xếp |\n| Ép quá, tim đập nhanh | Trang nghĩ — *\"Tệ nhất thì sao?\"* rồi trả lời cho hết |\n| Cùng một chuyện nghĩ đi nghĩ lại | Trang nghĩ — viết ra, phân đôi có việc/không việc |\n| Có món mới nhảy vào giữa lúc bận | Danh sách chờ — một dòng |\n| Không biết món này có đáng không | Trang chấm — hoặc mở cuốn **Chấm** nếu muốn chấm kỹ |\n| Thấy mình \"đáng lẽ phải…\" | Trang nghĩ — viết cái kỳ vọng ngầm ra (cuốn **Thấy**, chương 6) |\n| Thèm cầm điện thoại | Một dòng: *mình đang chạy khỏi cái gì?* |\n| Việc xong mà người vẫn căng | Không viết — đi bộ, hoặc kể cho một người (mục 2, động tác ĐÓNG) |\n\n💡 **MẸO:** Đừng mua sổ đẹp. Sổ đẹp làm người ta ngại viết bậy, mà cả hệ này sống bằng chuyện viết bậy. Một cuốn vở học trò là đủ.\n\n---\n\n## TỜ ĂN GIAN — in ra, dán lên vách\n\n**Đang quản cái gì:** chọn thứ nào được có mặt trong đầu — bậc sớm hơn cả chọn việc, chọn lời.\n\n**Ý lớn nhất:** lúc mệt, bạn chọn theo cái **gần tay**, không theo cái đáng. Dùng lúc tỉnh dọn đường, sao cho lúc mệt, việc đáng làm là việc dễ làm nhất.\n\n**CHECK-IN** — nhịp chính trong ngày. **Ngồi xuống, nằm xuống = an = check-in. Đi đứng nên là chánh niệm** — không chánh niệm lúc đi thì nguy hiểm. Câu ba của check-in có **ba đáp án**: không có gì · có cảnh khác (ghi một dòng) · **cảnh trong đầu chính là cảnh đang diễn ra ở đây** (không làm gì, đang chánh niệm rồi). Muốn nghĩ lúc đi thì **mở** trước, mang theo đúng một cái đã qua năm nhịp — có mở là **chọn nghĩ**, không mở là **bị nghĩ**. Đang bị mà chợt nhớ ra thì mở luôn. Ba cửa hay gặp: chuyển cảnh · cầm tới điện thoại · chợt nhớ ra.\n*ĐÓNG* (xong việc, rời nơi, tĩnh lại): 3 nhịp thở · **vừa** ở đâu · cơ thể **vừa** thế nào · cảnh nào **vừa** trong đầu. Rồi đi, và đi thì tập trung vào đi.\n*MỞ* (tới chỗ mới, an lại): 3 nhịp thở · **đang** ở đâu · cơ thể **đang** thế nào · cảnh gì **đang** trong đầu.\nKhông có gì thì đi tiếp; có thì ghi một dòng vào Danh sách chờ.\n**Ba tầng:** check-in **bắt** (suốt ngày, vài giây) · tối **làm rõ** một hai món (năm nhịp) · rà tuần **phân loại** và xếp ô.\n\n**Năm nhịp:** cảnh gì — **hay câu gì** · câu chuyện chạm cảm xúc · **đối tượng chính = [cái gì] của [ai]** · có đáng không · có áp lực không. (Chấm kỹ bằng điểm số: cuốn **Chấm**.)\n\n**Nếu trong đầu là một CÂU HỎI trần, không có cảnh:** câu **nóng** (đọc lên thấy nặng ngay) → nhảy thẳng nhịp 3, đối tượng nằm sẵn trong câu. Câu **khô mà dai** (nghe kỹ thuật, lẽ ra tra một cái là xong, mà cứ trồi hoài) → bắt buộc qua nhịp 2, nó đang đứng thay cho câu khác.\n\n**Khuôn nhịp 2:** sợ rằng · lo rằng · mong rằng · bực mình vì · tiếc rằng · **lẽ ra phải** (kỳ vọng ngầm) · **với chính mình, vì cái gì của bản thân** · **thấy ra là** (bài học).\n\n**Hai bảng:** TRONG → gỡ · NGOÀI → giữ, và là bộ lọc nạp cho ô 3.\n\n| | Rất đáng | Đáng | Không đáng |\n|---|---|---|---|\n| **Rất áp lực** | **1 ĐÓNG CỬA TẬP TRUNG** | **4 NGHĨ ĐỦ RỒI THÔI** | **7 TRẢ VỀ ĐÚNG CHỦ** |\n| **Áp lực** | **2 DỰ ÁN THỰC THI** | **5 GOM MỘT MẺ** | **8 HẸN GIỜ MÀ NGHĨ** |\n| **Không áp lực** | **3 ★ NỀ NẾP THÔNG MINH** | **6 NGHIÊN CỨU & TRẢI NGHIỆM** | **9 XÓA VÀ DỰNG RÀO** |\n\n**Nếp ô 3 bám chắc bằng NGHI THỨC:** cửa (chuyển cảnh nào châm ngòi) · mở (động tác nhỏ, rẻ tới mức không từ chối được) · thân (việc chính, dài ngắn tùy hôm) · đóng (dấu chấm hết). Mở và đóng quan trọng hơn thân. Một món một lúc.\n\n**Ba nhóm:** SINH LỢI 2·3·6 (gieo) · XỬ LÝ 1·4·5 (làm cho xong) · DỌN DẸP 7·8·9 (lấy lại chỗ).\n**Đường sinh lợi:** 6 → 2 → 3. **Thứ tự dọn:** 9 → 7 → 8. **Cạn giờ thì cắt hai nhóm sau.**\n\n**Bốn động tác:** Viết ra · Đóng (việc / trong lòng / trong người) · Hạ giá · Thế chỗ.\n**Hai luật cửa vào:** dưới 2 phút làm ngay · chạm một lần là quyết luôn.\n**Lịch tuần:** ô 3 vào giờ vàng · 1 khối mẻ · 30ph hẹn nghĩ · 2–3 cữ liên lạc · 20% đệm.\n**Rà tuần:** *dọn* Trút → Chấm → Mổ → Gạch · *sinh lợi* Đếm → Bảng NGOÀI → Sổ thử → Đặt khối → Chọn ba.\n\n*— Hết cuốn Dùng —*\n", "cham": "# KHÔNG GIAN TRONG ĐẦU\n\n## Cuốn CHẤM\n\n*Bộ năm: **Thấy · Dùng · Chấm · Cảm · Thử***\n\n*Cuốn này để chấm kỹ bằng điểm số. Chưa cần nó vẫn chạy được hệ — cuốn **Dùng** bảo áng chừng là đủ, và áng chừng đúng thật trong phần lớn trường hợp. Mở cuốn này khi hai món ngang nhau mà phải chọn, khi ngờ mình đang tự bênh một món, hoặc khi ngồi buổi rà tuần muốn chấm cho ra thứ tự.*\n\n*Ai muốn xem chấm rồi thì mở cuốn **Thử** — bảy mươi ca đã chấm, bày hết điểm từng câu.*\n\n---\n\n## Hai cái thước\n\nCả hai đều là một phân số, tử chia mẫu, và đều chia làm ba mức.\n\n> **ÁP LỰC = CÁI GIÁ ĐÃ HIỆN RA ÷ KHẢ NĂNG TRẢ MÌNH THẤY MÌNH CÓ**\n>\n> **ĐÁNG = GIÁ TRỊ ÷ GIÁ**\n\nViệc thật của chúng không phải cho ra con số. Là bắt bạn **nói rõ ra** cái mình vốn đã cảm thấy mà chưa gọi tên. Con số chỉ là cái rơi ra sau.\n\n---\n\n## THƯỚC ÁP LỰC\n\nChấm bằng **ba cặp**. Mỗi cặp gồm một câu nêu cái giá, và một câu hỏi ngay: *xử lý được không?* Câu trước cho tử số, câu sau cho mẫu số.\n\n| | Nêu cái giá — 0–3 điểm | Xử lý được không — 1–3 điểm |\n|---|---|---|\n| **1** | **Mất gì?** | Cái mất đó, mình bù lại được không? |\n| **2** | **Sợ gì?** | Cái sợ đó, mình xử được không? |\n| **3** | **Cái sợ đó khi nào tới?** | Lúc nó tới, mình xử được không? |\n\n**Cột trái — nêu cái giá.** Không hỏi *có rõ không*; hỏi thẳng, và độ khó trả lời chính là điểm số.\n\n- ***Mất gì?*** Nêu cụ thể được → 3 · nêu được nhưng mơ hồ → 1–2 · nghĩ không ra → 0.\n- ***Sợ gì?*** Gọi được tên nỗi sợ (mất mặt trước ai, mất khoản nào, ai sẽ nói câu gì) → 3 · chỉ thấy nôn nao chung chung → 1 · không thấy gì → 0.\n- ***Cái sợ đó khi nào tới?*** Hỏi thời điểm **cái sợ vừa nêu** ập tới, không phải hạn của việc. Đang diễn ra rồi → 3 · hôm nay, mai → 3 · trong tuần, trong tháng → 2 · còn xa → 1 · nghĩ mãi không thấy nó tới lúc nào → 0.\n\n**Cột phải — xử lý được không.** Chỉ hỏi đúng câu đó. Được → 3 · phần nào → 2 · không → 1.\n\nHiểu \"xử lý được\" theo cách nào cũng đúng. Một tỷ cách cũng được, kể cả cách sai — ai tự tin nhầm thì chấm cao, và đúng là họ không thấy ép thật.\n\n**Cách cộng.** Tử số = tổng cột trái (0–9). Mẫu số = tổng cột phải (3–9). Chia.\n\n> **≥ 1,5 rất áp lực · 0,7–1,5 áp lực · < 0,7 không áp lực**\n\n⚠️ **Đừng lấy hạn nộp thay cho câu thứ ba.** Bảng lương hạn thứ Hai, nhưng cái sợ — sếp gọi lên, mất uy trước phòng — có khi tuần sau mới tới, có khi không bao giờ. Ngược lại, cái ấm ức chẳng có hạn nào cả, mà cái sợ trong đó **đang diễn ra**, mỗi lần nghĩ tới là một lần tới: chấm 3. Đó là lý do một chuyện không gấp gáp gì vẫn ép được người ta suốt mười năm.\n\n⚠️ **Nhịp chấm khác thước Đáng.** Đáng chấm một lần, dùng cả tuần, vì nó ổn định. Áp lực đổi từng ngày — hôm nay 0,8, mai cái sợ tới gần hơn có thể thành 2,1. Chấm lại mỗi khi món đó trồi lên.\n\n💡 Chữ \"sợ\" chỉ là chữ ngắn nhất. Đúng cảm giác của bạn là ngại, bực, hay tiếc thì dùng chữ đó — miễn gọi được tên.\n\n**Áng chừng khi không có giờ:** *rất áp lực* là cái giá hiện rõ mồn một và sắp phải trả, nghĩ chuyện khác không nổi · *áp lực* là đã thấy cái giá nhưng chưa sát · *không áp lực* là chưa thấy cái giá nào.\n\n---\n\n## THƯỚC ĐÁNG\n\n### Tử số — giá trị\n\nĐi từ ý nghĩa. Mà ý nghĩa có hai điều kiện — **thiếu nó** và **có nó** — nhân hai hệ quả — **chết** và **sống**. Thành bốn ô, hỏi đủ cả bốn:\n\n| | → CHẾT | → SỐNG |\n|---|---|---|\n| **THIẾU nó** | **A.** Thiếu thì cái gì trong mình chết? **(+)** | **B.** Thiếu thì cái gì trong mình sống? **(−)** |\n| **CÓ nó** | **D.** Có thì cái gì trong mình chết? **(−)** | **C.** Có thì cái gì trong mình sống? **(+)** |\n\nMỗi ô hỏi ba câu, mỗi câu 0–3 điểm: **cái gì** · **mấy phần** · **bao lâu**. Mỗi ô ra 0–9.\n\n> **TỬ SỐ = (A + C) − (B + D)**\n\nTrong mình có hai thứ chết và sống được: **thể xác** và **tâm hồn**. Hỏi cả hai.\n\nBốn ô, mỗi ô một việc:\n\n- **A** bắt cái mình cần. Thiếu ngủ thì thân chết, thiếu người thân thì hồn chết.\n- **C** bắt cái mình được. Không có A mà vẫn cao C thì vẫn đáng: học kỹ năng mới, đi du lịch, làm việc thiện.\n- **B** bắt cái giá của kỷ luật. Bỏ tập thì được lại một tiếng — thật, không phải ngụy biện. Ô này trừ, và trừ đúng.\n- **D** bắt cái càng có càng mất: rượu, thuốc lá, cờ bạc, so đo hơn thua, một quan hệ độc hại. Thiếu ô này thì rượu chấm ngang đi du lịch, vì cả hai đều \"thiếu chẳng chết gì, có thì được chút gì\".\n\n### Mẫu số — giá\n\nHai câu, mỗi câu 1–3 điểm, cao là đắt:\n\n- ***Có sẵn chưa?*** Đang có, đang duy trì → 1 · có một phần → 2 · chưa có, phải đi lấy → 3.\n- ***Dễ trả giá không?*** — xét theo **nguồn lực mình đang có**: tiền, quan hệ, kiến thức, sức. Thừa sức → 1 · phải cố → 2 · ngoài tầm → 3.\n\nMẫu số là chỗ nguồn lực đi vào. Cùng một món, người nhiều tiền trả bằng tiền, người nhiều quan hệ nhờ được người, người có nghề tự làm lấy — nên cùng một thứ mà hai người chấm hai giá khác nhau, và cả hai đều đúng.\n\nVới món ra âm thì hai câu này đọc ngược mà vẫn chạy: có sẵn và rẻ nghĩa là **khó bỏ** — rượu bán đầy đường, điện thoại nằm trong túi, cái ấm ức có sẵn trong đầu khỏi đi lấy. Mẫu nhỏ thì âm sâu hơn, đúng chiều.\n\n### Ba mức\n\nTử số −18 đến +18 chia mẫu số 2–6.\n\n> **≥ 4 rất đáng · 1,5–4 đáng · < 1,5 không đáng**\n\nRa âm thì gộp thẳng vào **không đáng**, không cần mốc riêng, không cần xếp hạng. Thấp đã bỏ rồi thì âm cũng bỏ, y như nhau.\n\n---\n\n## BA LUẬT CHẤM\n\n**Một — chấm lúc yên, mổ lúc vào việc.** Danh sách chấm lúc tỉnh là chỗ giữ lại phán đoán của lúc đầu óc còn sáng, để tham khảo. Nó không phải chân lý, và nó không đủ. Vào việc thì cứ chấm, cứ xếp — chấm giữa cơn cũng là một lần chấm trong hoàn cảnh thật, và chỗ nào vào việc thấy khác với lúc tỉnh thì đó chính là chỗ đáng sửa lại danh sách.\n\n**Hai — bắt đầu bằng cái thô cũng được, thực chiến sẽ mổ nó ra.** Lúc tỉnh chỉ nghĩ ra được tới mức thô: *tiền*. Vào việc thì cái trồi lên không bao giờ là \"tiền\" — nó là **cách tiêu tiền**, **cách kiếm tiền**, **cách để dành**, **cách đầu tư**. Bốn nhánh ấy chấm khác nhau hẳn: có người cách kiếm thì rất đáng nghĩ mà cách tiêu thì không.\n\nNên đừng cố chấm cho đúng mức cụ thể ngay từ đầu — mức cụ thể chỉ lộ ra khi vào việc. Danh sách càng dùng càng chi tiết ra, không phải càng dùng càng thuộc.\n\n**Ba — giá trị cao mà giá đắt thì đừng bỏ, hạ giá** (xem Bốn động tác, cuốn Dùng).\n\n💡 **Mổ ra rồi thì đếm được.** Ghi lại mỗi lần một nhánh trồi lên. Nhánh nào trồi nhiều nhất là nhánh đang chiếm chỗ thật, bất kể lúc tỉnh chấm nó bao nhiêu. Đây là con số duy nhất trong cả hệ bạn **đếm** được chứ không phải cho điểm — nên nó đáng tin hơn mọi điểm số ở trên.\n\n⚠️ **Cụ thể vừa đủ, đừng cụ thể tới mức thành một cách làm.** \"Gia đình\" thì quá rộng, chấm vô nghĩa. Nhưng \"đi biển mỗi năm\" lại quá hẹp — đó là *một cách* đi du lịch, và cách cụ thể bao giờ cũng đắt hơn mà không nuôi thêm gì, nên chấm ra thấp oan. Chấm \"đi du lịch\", \"học kỹ năng mới\", \"gọi mẹ tối chủ nhật\" — đúng tầm.\n\n---\n\n## HAI CÁI THƯỚC ĐO BẠN, KHÔNG ĐO MÓN\n\nCùng một chuyện, người này ép muốn nghẹt thở, người kia thấy bình thường. Cùng một việc, người này chấm rất đáng, người kia chấm không đáng. Đó không phải một người chấm sai — đó là hai người khác nhau, và cả hai đều chấm đúng cho mình.\n\nVì hai cái thước này không đo cái món. Chúng đo **quan hệ giữa bạn và món đó**: bạn thấy mất gì, bạn sợ gì, bạn nghĩ mình xử được không, bạn thấy thiếu nó thì cái gì trong bạn chết. Đổi người là đổi hết.\n\nBa hệ quả, và cả ba đều làm mọi thứ nhẹ đi:\n\n- **Điểm của bạn không so được với ai, và cũng không cần so.** Không có bảng chuẩn nào ngoài kia để đối chiếu.\n- **Mấy con mốc chia mức sẽ không bao giờ \"chuẩn\".** Không phải vì chưa ai hiệu chuẩn — mà vì chẳng có chuẩn chung nào để hiệu chuẩn theo. Chúng chỉ là chỗ để bắt đầu, rồi bạn tự kéo cho vừa mình.\n- **Cái chạy được là thứ tự trong bảng của chính bạn.** Món nào ép hơn món nào, món nào đáng hơn món nào — chỉ vậy là đủ để xếp ô.\n\n⚠️ Đừng dùng thước này để phán người khác — kiểu \"việc đó có gì đâu mà nó căng thế\". Trong bảng của họ, mẫu số khác bảng của bạn.\n\n---\n\n## CHẤM THỬ VÀI MÓN\n\n| Món | Tử | Mẫu | Đáng | Mức |\n|---|---|---|---|---|\n| Không khí, nước sạch, ngủ đủ | 18 | 2 | 9,00 | rất đáng |\n| Cha mẹ | 15 | 2 | 7,50 | rất đáng |\n| Vệ sinh cá nhân | 14 | 2 | 7,00 | rất đáng |\n| Cái nghề mình theo | 14 | 3 | 4,67 | rất đáng |\n| Con cái | 15 | 4 | 3,75 | đáng |\n| Học kỹ năng mới | 13 | 4 | 3,25 | đáng |\n| Nhà ở ổn định | 14 | 6 | 2,33 | đáng |\n| Đi du lịch | 8 | 4 | 2,00 | đáng |\n| Danh tiếng, chức vụ | 1 | 6 | 0,17 | không đáng |\n| Ấm ức, thù dai | −14 | 4 | −3,50 | không đáng |\n| Rượu / thuốc lá | −12 | 2 | −6,00 | không đáng |\n\nNhìn ba dòng đầu: **thứ nuôi mình sống mà rẻ thì đáng nhất, chứ không phải thứ mình quý nhất.** Ai cũng quý con hơn không khí — mà thử một phút không có không khí xem. Bảng này không xếp hạng thiêng liêng; nó xếp hạng cái đáng cho một chỗ trong đầu.\n\nDòng \"danh tiếng, chức vụ\" nói điều ngược lại: thiếu chẳng chết gì, có cũng chỉ sống thêm chút ít, mà giá đắt nhất bảng — trong khi ngoài đời nó lại là thứ chiếm chỗ trong đầu người ta nhiều nhất.\n\n---\n\n## HAI CHỮ \"GIÁ\"\n\nBộ này dùng chữ \"giá\" ở hai chỗ, và hai chỗ đo hai thứ khác nhau. Lẫn là hỏng cả hệ.\n\n| | Giá ở **ÁP LỰC** | Giá ở **ĐÁNG** |\n|---|---|---|\n| Đo cái gì | Mất gì nếu **không làm** — và phần đó **đã hiện ra** tới đâu | Nó ngốn của mình bao nhiêu khi **làm** |\n| Ví như | Tiền phạt đã có giấy báo | Học phí |\n| Tính lúc nào | Ngay lúc này, đổi theo ngày | Ổn định, chấm một lần dùng cả tuần |\n\nHai cái độc lập với nhau. Học phí rẻ mà tiền phạt đã có giấy báo → rất áp lực, đáng: đó là ô 4. Học phí nặng mà chưa có giấy báo nào → rất đáng, không áp lực: đó là ô 3, và đó là lý do ô 3 khó giữ đến thế — không phải vì nó không có cái giá, mà vì cái giá của nó chưa hiện.\n\n---\n\n## TỜ CHẤM — in ra, kẹp vào sổ\n\n**ÁP LỰC** — ba cặp, trái 0–3, phải 1–3:\nmất gì / bù được không · sợ gì / xử được không · cái sợ đó khi nào tới / lúc nó tới xử được không\nTử 0–9 ÷ mẫu 3–9. **≥1,5 rất áp lực · 0,7–1,5 áp lực · <0,7 không áp lực**\n\n**ĐÁNG** — bốn ô, mỗi ô 3 câu (*cái gì · mấy phần · bao lâu*), mỗi câu 0–3. Hỏi cho cả **thể xác** lẫn **tâm hồn**:\nA thiếu → chết **(+)** · C có → sống **(+)** · B thiếu → sống **(−)** · D có → chết **(−)**\nTử = (A+C) − (B+D), từ −18 đến +18\nMẫu = có sẵn chưa (1–3) + dễ trả không, theo nguồn lực mình có (1–3), từ 2–6\n**≥4 rất đáng · 1,5–4 đáng · <1,5 không đáng** (âm gộp vào đây)\n\n**Ba luật:** chấm lúc yên, mổ lúc vào việc · bắt đầu bằng cái thô cũng được · giá trị cao mà giá đắt thì hạ giá, đừng bỏ.\n\n**Nhớ:** mốc chỉ là chỗ bắt đầu, cái dùng được là **thứ tự** trong bảng của chính mình.\n\n*— Hết cuốn Chấm —*\n", "cam": "# Cổng không có cánh\n\n## Cuốn CẢM — Cổng không có cánh\n\n*Bộ năm: **Thấy · Dùng · Chấm · Cảm · Thử** — mười một đoản văn*\n\n---\n\n## 1. Lên đồi\n\nĐợt đó tôi mất ngủ.\n\nKhông có chuyện gì lớn. Chỉ là đêm nào nằm xuống, trong đầu cũng có người nói. Hết người này tới người kia. Ba giờ sáng tôi vẫn nằm nghe, như người giữ quán không được phép đóng cửa.\n\nMột người quen mách tôi cái am trên đồi, sau làng ngoại. Nói trên đó có ông thầy già, ở chơi ít bữa cho khỏe. Tôi đi, kiểu người chết đuối quơ cây rơm, không tin lắm.\n\nĐường lên đồi là đường đất, hai bên trồng chè. Cái am nhỏ, mái ngói cũ, sân gạch có cây mai già. Cổng xây bằng đá ong, rêu phủ, mà không có cánh cửa — chỉ là hai trụ với một khoảng trống ở giữa, đi thẳng vào.\n\nThầy đang ngồi ở hiên, thấy tôi thì gật đầu như thấy người quen, rót thêm một chén trà. Tôi chào, nói vòng vo lý do. Thầy nghe hết, rồi nói mỗi một câu:\n\n\"Ừ, con ở chơi ít bữa.\"\n\nChiều đó, lúc phụ chú tiểu An xách nước, tôi hỏi cho có chuyện:\n\n\"Cổng không có cánh thì giữ được cái gì hả thầy?\"\n\nThầy đang phơi lá chè, không ngẩng lên.\n\n\"Giữ là biết ai vô, con.\"\n\n---\n\n## 2. Nhà có khách\n\nĐêm đầu ở am tôi cũng không ngủ được. Lạ chỗ thì ít, mà cái quán trong đầu vẫn mở thì nhiều.\n\nSáng ra tôi thưa thiệt với thầy: con nằm mà cái đầu như cái chợ.\n\nThầy rót trà, đẩy chén về phía tôi.\n\n\"Chợ là chỗ ai vô cũng được,\" thầy nói. \"Nhà thì khác. Nhà có người ra mở cửa, có người mời ngồi, có người tiễn.\"\n\n\"Nhưng mấy cái đó nó tự vô, thầy. Con đâu có mời.\"\n\n\"Khách tới có ai mời đâu con. Tới là tới.\" Thầy nhấp một ngụm. \"Cái khác nhau không nằm ở chỗ họ tới. Nằm ở chỗ mình có biết là họ đang tới không. Biết, thì mình là chủ nhà. Không biết, thì họ ở luôn, và mình thành người ở đậu trong chính cái nhà của mình.\"\n\nTôi ngồi im. Ngoài sân, tiểu An đang quét lá, tiếng chổi đưa đều đều.\n\n\"Ở đây ai tới thầy cũng tiếp,\" thầy nói thêm, như chợt nhớ. \"Mà tiếp từng người một. Hai người tới cùng lúc thì một người ngồi ghế chờ. Ghế chờ ở hiên đó, con thấy không — ngồi đó cũng mát, không ai chết vì ngồi ghế chờ hết.\"\n\n---\n\n## 3. Quét lá\n\nViệc đầu tiên thầy giao cho tôi là quét sân.\n\nSân gạch không rộng, tôi quét một loáng là sạch. Đứng chống chổi ngắm thành quả được đúng một lúc thì gió qua, lá trứng cá rụng xuống chỗ vừa quét. Tôi quét lại. Gió lại qua.\n\nTới ngày thứ ba thì tôi muốn liệng cây chổi. Tôi nói với thầy, giọng nửa đùa nửa thật, là quét kiểu này tới Tết cũng không xong.\n\nThầy đang quét ở góc sân bên kia. Nhát chổi của thầy chậm, đều, không có vẻ gì là đang chạy đua với cái cây.\n\n\"Thầy quét cái sân này bốn chục năm rồi,\" thầy nói. \"Chưa xong bữa nào.\"\n\n\"Vậy sao thầy quét nổi?\"\n\nThầy gom lá vô ky, đứng thẳng lưng lên, nhìn tôi.\n\n\"Tại thầy không quét cho hết lá.\"\n\nRồi thầy xách ky lá đi về phía vườn rau, để tôi đứng đó với cây chổi. Tôi nghĩ mãi câu đó. Không quét cho hết lá thì quét cho cái gì — thầy không nói. Nhưng từ hôm sau, nhát chổi của tôi tự nhiên chậm lại, và cái sân không quét xong đó không làm tôi bực nữa.\n\n---\n\n## 4. Giấy báo\n\nỞ am tới ngày thứ tư thì cái quán trong đầu tôi vãn khách được đôi phần. Nhưng có một người khách lì, đêm nào cũng tới: chuyện cái hợp đồng ở thành phố. Bên kia chưa trả lời. Nếu họ rút thì tôi kẹt một khoản lớn.\n\nĐêm đó tôi ra hiên ngồi, gặp thầy cũng ngồi đó, không đèn, chỉ có trăng với tiếng côn trùng. Tôi kể. Kể xong thấy nhẹ được một chút, như người khai bệnh.\n\nThầy nghe hết, hỏi đúng một câu:\n\n\"Cái tin dữ đó, nó tới chưa?\"\n\n\"Dạ chưa. Chắc tuần sau mới biết.\"\n\n\"Chưa tới,\" thầy gật gù, \"mà con trả trước rồi. Mất ngủ ba đêm, là trả ba đêm rồi đó.\"\n\nTôi cười khổ. Thầy rót nước từ cái ấm ủ trong giỏ, đưa tôi chén, rồi nói tiếp, giọng như nói chuyện thời tiết:\n\n\"Ngộ lắm con. Cái chưa có mà cũng lấy được tiền của mình. Là vì mình đưa trước.\"\n\nĐêm đó tôi nằm nghĩ: nếu tuần sau tin dữ tới thật, thì tôi trả lúc đó, một lần, đúng giá. Còn trả từ bây giờ là trả mỗi đêm một lần, và tin lành hay dữ gì cũng không bớt cho tôi đêm nào. Nghĩ được vậy thì ngủ. Không phải hết lo — mà là thôi trả.\n\n---\n\n## 5. Cây mai\n\nSáng nào cũng vậy, việc đầu tiên của thầy là tưới cây mai già giữa sân. Trước cả ăn sáng, trước cả công phu. Trời mưa đêm trước thì thầy ra đứng với nó một chút, coi như thăm.\n\nMột bữa tôi hỏi:\n\n\"Cây mai này có bao giờ kêu khát đâu thầy. Sao thầy tưới nó trước nhất?\"\n\nThầy vặn nhỏ vòi nước, để nước ngấm từ từ xuống gốc.\n\n\"Tại nó không biết kêu đó con,\" thầy nói. \"Cái gì biết kêu thì tự khắc có người lo. Cơm sôi thì kêu, chó đói thì kêu, người ta cần mình thì réo. Còn cây mai, nó im. Im tới chết luôn. Nên phải tưới nó trước mấy đứa biết kêu — không thôi cả ngày mình chỉ chạy theo tiếng kêu, mà mấy thứ quý nhất trong đời thì có cái nào biết kêu đâu.\"\n\nThầy khóa vòi nước, đứng ngắm tán cây một lát.\n\n\"Với lại thầy già rồi. Còn coi nó nở được mấy mùa nữa đâu mà dám quên bữa nào.\"\n\nCâu sau thầy nói nhỏ, như nói với cái cây chứ không phải với tôi.\n\nTôi đứng đó, nhìn cái vòi nước, thấy chuyện của thầy với cái cây thì rõ rành rành — dễ thấy hơn chuyện của chính mình nhiều. Chắc tại mình đứng ngoài. Đứng ngoài thì không phải bênh ai, không mất gì, nên nhìn được cả cái sân.\n\nRồi tự nhiên tôi nghĩ tới má tôi ở quê. Má tôi cũng không biết kêu. Cả năm nay má chỉ nhắn đúng một kiểu: *thôi con bận thì thôi.*\n\nCái ngộ là tôi biết chuyện đó từ lâu rồi. Biết mà nó nằm im, không nhúc nhích. Phải đứng coi ông già tưới một cái cây không phải cây của mình, thì nó mới chịu trồi lên.\n\nChiều đó tôi mượn tiểu An chạy xuống bưu điện xã, gọi về cho má một cuộc. Chuyện trò cũng không có gì. Mà đi lên đồi, chân tôi nhẹ hều.\n\n---\n\n## 6. Ông Tư\n\nÔng Tư ở xóm dưới, lâu lâu nhậu xỉn lại lên am. Lên không phải để lễ, mà để kể tội thằng em ruột giành đất, chuyện từ hồi nảo hồi nao. Kể to, kể dai, có khi đập bàn.\n\nBữa đó ông lên đúng lúc tôi đang hầu trà thầy. Tôi nhấp nhổm, tính kiếm cớ mời ông về giùm. Thầy thì không. Thầy rót cho ông chén nước, ngồi nghe. Ông kể chuyện cũ y như mọi lần, thầy nghe y như lần đầu. Chừng tàn một tuần trà, ông tự đứng dậy, chào, đi xuống đồi, bước chân coi bộ vững hơn lúc lên.\n\n\"Sao thầy không nói cho ổng ra lẽ?\" tôi hỏi. \"Chuyện đó ổng kể chắc trăm lần rồi.\"\n\n\"Ra lẽ nào con?\" thầy vừa úp chén vừa nói. \"Đất chia rồi, giấy ký rồi, thằng em ổng cũng mất rồi. Đâu còn gì để gỡ nữa.\"\n\n\"Vậy ổng lên đây làm chi cho mệt.\"\n\nThầy đặt cái chén xuống, nghĩ một lúc.\n\n\"Con nghe kỹ thì ổng không kể chuyện miếng đất đâu. Chuyện đất kể ba câu là hết. Ổng kể tới lui cái khác kìa — anh em trong một nhà thì đối với nhau kiểu gì. Cái đó thì có gỡ được đâu, mà cũng không phải để gỡ. Nó vẫn đáng nghĩ tới ngày ổng nằm xuống.\"\n\n\"Nghĩ hoài vậy không mệt hả thầy?\"\n\n\"Mệt là tại nghĩ mà không ai biết. Ổng lên đây, kể ra, có người ngồi nghe — vậy là cái chuyện đó có chỗ. Có chỗ rồi thì nó chịu nằm yên, tới chừng nào tới lượt nó thì nó lên tiếng.\" Thầy cười. \"Ổng cần cái lỗ tai, đâu cần cái lưỡi.\"\n\nTôi ngồi ngẫm. Hóa ra tiếp khách không phải lúc nào cũng là giải quyết cho khách. Có loại khách chỉ cần được ngồi ghế, uống chén nước, được có người biết là mình tới. Rồi tự về.\n\nMà tôi còn ngẫm thêm một chuyện nữa, chuyện này thầy không nói. Nãy giờ tôi ngồi nghe ông Tư, tưởng là nghe chuyện nhà ông. Tới lúc ông xuống đồi rồi, cái còn lại trong đầu tôi không phải miếng đất của ông, mà là thằng em tôi ở trong Nam — hai anh em cũng đã ba năm không gọi cho nhau, mà chẳng vì chuyện gì to tát cả.\n\nHôm sau ông Tư lại lên, nhưng nhằm giờ thầy ngồi thiền. Tiểu An ra hiên, khoanh tay lễ phép: \"Thầy con đang có giờ, bác ngồi chơi uống nước, hết cây nhang này thầy ra.\" Ông Tư ngồi chờ thiệt, hiền queo. Hết cây nhang, thầy ra, tiếp như thường.\n\nTôi để bụng cả hai chuyện: cửa am không đóng với ai, mà giờ của thầy thì có rào. Hai cái đó không cãi nhau.\n\n---\n\n## 7. Khách quen\n\nTới lúc đó thì tôi đã dám khai với thầy người khách lì nhất của tôi.\n\nKhông phải cái hợp đồng. Là một người bạn cũ, từng làm ăn chung. Chuyện tan vỡ ba năm rồi, tiền mất cũng đã mất rồi, mà tới giờ, đang rửa mặt tôi cũng cãi nhau với anh ta trong đầu. Những trận cãi tôi luôn thắng, thắng xong mệt lả.\n\n\"Nó hay tới tìm con lúc nào?\" thầy hỏi.\n\nTôi nghĩ một chút. \"Lúc con rửa chén. Lúc sắp ngủ. Lúc đi đường một mình.\"\n\n\"Toàn lựa lúc nhà con vắng mà tới,\" thầy gật gù. \"Khách quen quá rồi còn gì. Mà đã là khách quen thì hẹn được. Mai nó tới, con đừng đuổi — đuổi thì nó đứng ngoài cổng réo, con biết rồi đó. Con nói với nó một câu thôi: *chiều mai tôi tiếp anh.* Rồi chiều mai, con ngồi xuống tiếp nó thiệt. Đàng hoàng. Trà nước đàng hoàng.\"\n\nTôi tưởng thầy nói chơi. Nhưng chiều hôm sau tôi làm thiệt: ra ghế đá sau am, ngồi với đúng cái chuyện đó, không làm gì khác. Lần đầu tiên trong ba năm tôi nhìn thẳng nó thay vì để nó rượt sau lưng.\n\nNgồi hết buổi, tôi thấy ra hai điều. Một: trong cả câu chuyện dài đó, còn sót đúng một việc làm được — có một lời tôi nợ một người thứ ba, người bị vạ lây hồi đó, mà tôi tránh mặt tới giờ. Việc đó về thành phố làm được, mười phút. Hai: phần còn lại, tức là gần hết, giống chuyện ông Tư — không còn việc gì để làm.\n\nTối đó lúc nó lại mon men tới, tôi nói thầm: *tiếp rồi, hôm nay tiếp rồi.* Nó lảng. Tôi không biết phép đó linh được bao lâu. Nhưng đêm đó cái quán trong đầu tôi đóng cửa được trước mười một giờ.\n\n---\n\n## 8. Đôi dép\n\nMột tối tôi để ý thấy thầy làm mấy việc lạ trước khi đi nghỉ.\n\nThầy xếp đôi dép ở thềm, mũi dép quay ra ngoài. Châm nước đầy cái ấm, đặt lên bếp tro còn ấm. Cái bồ đoàn để ngay ngắn giữa chánh điện, y áo vắt sẵn trên giá. Xong hết thầy mới tắt đèn.\n\n\"Thầy kỹ quá,\" tôi buột miệng.\n\n\"Không phải kỹ đâu con.\" Thầy cười. \"Là thầy lo xa cho cái ông già sáng mai. Bốn giờ sáng, chuông đổ, ổng còn mê ngủ, còn làm biếng, còn muốn nằm thêm — cái ông đó không cãi lý được đâu. Nên tối nay, lúc còn tỉnh, mình dọn đường trước cho ổng: dép quay sẵn ra ngoài, chân xỏ vô là bước; nước sôi sẵn, ấm trà pha liền; bồ đoàn chờ sẵn, tới là ngồi. Ổng chỉ việc trôi theo, trôi một hồi là tới chỗ cần tới.\"\n\nThầy vỗ vỗ vai tôi:\n\n\"Người tỉnh lo cho người mê, con. Trong một ngày, mình làm người tỉnh có mấy lúc thôi. Mấy lúc đó đừng có đem đi cãi nhau với đời — đem đi xếp dép.\"\n\nTôi về buồng, nhìn quanh chỗ mình ở mấy bữa nay: cái áo vắt bừa, cuốn sách muốn đọc thì nằm dưới đáy túi, còn mấy thứ tôi không muốn dây vào thì bày ngay tầm tay. Hóa ra bấy lâu tôi toàn dọn đường sẵn cho thằng mê đi lạc.\n\nBên buồng tiểu An, tôi thấy chú nhỏ giấu cuốn truyện tranh vô rương, khóa lại, chìa quăng lên nóc tủ, xa hẳn cái gối. Chú thấy tôi nhìn thì gãi đầu: \"Không cất xa, sáng con tụng kinh không vô, chú ơi.\"\n\n---\n\n## 9. Đi cho cái thân nó hay\n\nBữa đó dưới làng có đám. Nhà nghèo, tang gấp, thầy xuống làm lễ từ trưa tới sẩm tối mới về. Việc lớn, người nhà khóc nhiều, thầy về tới am, mặt vẫn an mà tôi nhìn dáng đi biết là mệt.\n\nTôi tính pha trà mời thầy nghỉ. Thầy khoát tay, rủ:\n\n\"Đi với thầy một vòng đồi.\"\n\nHai thầy trò đi chậm quanh đồi chè, không nói gì. Trăng lên. Đi chừng nửa vòng, tôi nghe hơi thở của mình dài ra hồi nào không hay. Về tới cổng am, thầy mới nói, như trả lời câu tôi chưa hỏi:\n\n\"Việc thì xong dưới làng rồi. Mà cái thân nó chưa hay. Nó còn giữ nguyên đó, con coi hai cái vai thầy nè, hồi chiều giờ nó khiêng cái đám đó. Mình phải đi ít bước, thở ít hơi, cho nó hay là xong rồi. Không nói cho nó hay, nó khiêng tới trong giấc ngủ luôn.\"\n\nTôi chợt nhớ những đêm ở thành phố, việc đã gửi đi rồi, báo cáo đã nộp rồi, mà tôi nằm trên giường, hai hàm răng vẫn nghiến. Hồi đó tôi tưởng tại tôi nghĩ chưa thông. Giờ mới biết: cái đầu thì đã hay, mà tôi chưa từng báo cho cái thân.\n\n---\n\n## 10. Ngồi không\n\nSáng hôm sau, tôi hỏi thầy bữa nay làm việc gì. Thầy nói:\n\n\"Bữa nay nghỉ. Con ngồi chơi.\"\n\nTưởng dễ, hóa ra đó là bữa cực nhất từ hồi lên am. Ngồi ở hiên, không chổi, không nước, không việc — chưa đầy nửa canh giờ mà tôi như ngồi trên ổ kiến. Cái đầu tôi mở hội: chuyện hợp đồng, chuyện người bạn cũ, chuyện cái xe tới hạn thay nhớt, cả bài hát nào đó lặp đi lặp lại. Tôi qua thưa với thầy, gần như cầu cứu:\n\n\"Thầy ơi, đầu con ồn quá. Chắc con không hợp ngồi không.\"\n\nThầy đang lau cái chuông nhỏ, ngừng tay.\n\n\"Cái ồn đó có sẵn lâu rồi con. Ngày thường con lấy công việc đè lên, lấy cái máy nói chuyện đè lên, nên không nghe. Bữa nay con ngồi yên đủ lâu, mới nghe thấy nó thôi. Nghe thấy được là bước đầu, sao lại là không hợp?\"\n\nTôi ngồi lại. Lát sau tôi hỏi vói ra, câu hỏi của người quen tính đường dài:\n\n\"Vậy con phải ngồi bao lâu thì được hả thầy?\"\n\nThầy gõ nhẹ cái chuông một tiếng, để nó ngân hết rồi mới nói:\n\n\"Được cái gì con?\"\n\nTôi không trả lời được. Và lạ, chính lúc chịu thua câu đó, không mong được gì nữa, thì cái ngồi mới bắt đầu dễ. Nắng bò qua sân. Lá rụng. Xa xa có tiếng gà. Trong một quãng ngắn — ngắn thôi — nhà tôi không có người khách nào. Chỉ có tôi ngồi trong nhà của mình.\n\n---\n\n## 11. Xuống đồi\n\nBữa tôi về, thầy tiễn ra tới cổng đá ong.\n\nTôi đã gói ghém câu hỏi này mấy bữa, tới đó mới dám đưa:\n\n\"Thầy ơi, rốt cuộc mấy bữa nay thầy dạy con cái gì, con muốn nắm cho gọn để về khỏi quên.\"\n\nThầy đứng giữa hai trụ cổng, chỗ đáng lẽ có cánh cửa mà không có cánh cửa nào.\n\n\"Thầy có dạy chi đâu con,\" thầy nói. \"Thầy tiếp khách.\"\n\nTôi cúi chào, đi xuống đồi. Được một quãng, ngoái lại thì thầy đã vô trong, chỉ còn cái cổng trống đứng đó, rêu xanh, mở về cả hai phía.\n\nVề thành phố, tôi làm cái việc mười phút còn nợ — tìm gặp người thứ ba năm xưa, nói một lời. Nói xong, người nhẹ đi một khoản không cân được.\n\nCòn lại thì đời tôi vẫn vậy: việc vẫn nhiều, tin nhắn vẫn réo, khách trong đầu vẫn tới không hẹn trước. Tôi vẫn thua đều. Chỉ có vài chuyện nhỏ đổi: tối tôi xếp đôi dép mũi quay ra phía bàn làm việc, cuốn sách đọc dở nằm trên gối thay vì trong ngăn kéo. Chuyện cũ nào ghé, tôi rót cho nó một chén, hẹn nó chiều thứ bảy — có tuần tôi thất hứa, nó réo, tôi lại hẹn. Và lâu lâu, giữa ngày, tôi dừng lại thở ba hơi, không để được cái gì hết.\n\nMá tôi thì tuần nào cũng nhận được một cuộc gọi. Má vẫn nói y một câu, *thôi con bận thì thôi* — mà giọng nghe khác hẳn.\n\nCái cổng đó tôi không xây được ở thành phố. Nhưng tôi hay nghĩ về nó: một cái cổng không có cánh, không cản được ai, mà ai đi qua, chủ nhà đều biết.\n\nChắc giữ cổng, là vậy.\n\n**— Hết —**\n", "thu": "# KHÔNG GIAN TRONG ĐẦU\n\n## Cuốn THỬ\n\n*Bộ năm: **Thấy · Dùng · Chấm · Cảm · Thử***\n\n*Cuốn này để soi. Bảy mươi ca chấm bằng khung hiện hành, bày hết điểm từng câu ở mười hai ca mẫu, kèm những chỗ khung đã từng gãy và được sửa. Ai muốn học chấm bằng tay thì bắt đầu từ phần 2.*\n\n---\n\n## Cách đọc cuốn này\n\nMọi ca ở đây đều do một người chấm — người viết bộ sách. Nên nó chứng minh được ba thứ: khung không tự mâu thuẫn, khung tách được các cặp dễ nhầm, và khung chịu được lệch điểm. Nó không chứng minh được rằng người khác chấm cùng một món sẽ ra cùng kết quả — và theo cuốn Thấy thì cũng không cần: hai cái thước đo bạn, không đo món.\n\n**Khung chấm:**\n\n- Đáng = (A + C) − (B + D) ÷ (có sẵn + dễ trả). Mỗi ô A B C D ba câu *cái gì · mấy phần · bao lâu*, mỗi câu 0–3. Mẫu số mỗi câu 1–3.\n- Áp lực = (mất gì + sợ gì + cái sợ khi nào tới) ÷ (ba câu xử được không). Trái 0–3, phải 1–3.\n- Mốc: đáng ≥4 rất đáng · 1,5–4 đáng · <1,5 không đáng — áp lực ≥1,5 rất áp lực · 0,7–1,5 áp lực · <0,7 không áp lực.\n\n---\n\n## 1. Bảy mươi ca xếp vào chín ô\n\n| Ô | Cách xử | Số ca |\n|---|---|---|\n| **1** | Đóng cửa tập trung | 2 |\n| **2** | Dự án thực thi | 7 |\n| **3** | Nề nếp thông minh ⭐ | 11 |\n| **4** | Nghĩ đủ rồi thôi | 2 |\n| **5** | Gom một mẻ | 12 |\n| **6** | Nghiên cứu và trải nghiệm | 15 |\n| **7** | Trả về đúng chủ | 2 |\n| **8** | Hẹn giờ mà nghĩ | 12 |\n| **9** | Xóa và dựng rào | 7 |\n\nĐủ cả chín ô. Mức đáng: rất đáng 20 · đáng 29 · không đáng 21. Mức áp lực: rất áp lực 6 · áp lực 31 · không áp lực 33. Bảng TRONG 61 · NGOÀI 9.\n\nÔ 2 chảy về ô 3: bảy ca ô 2 thì phần lớn là dự án dựng nếp — đi khám, học kỹ năng mới, đổi nghề, mua nhà. Xong cái nào thì để lại một nếp trong ô 3.\n\nHai số đáng để ý. Ô 1 và ô 7 mỗi ô chỉ hai ca — hợp, vì thứ ép mạnh thật thì --|---|---|---|---|\n| A — thiếu → chết | 0 | 0 | 0 | **0** | + |\n| B — thiếu → sống | 2 | 2 | 2 | **6** | − |\n| C — có → sống | 1 | 1 | 0 | **2** | + |\n| D — có → chết | 2 | 2 | 2 | **6** | − |\n\nTử số = (0 + 2) − (6 + 6) = **-10** · Mẫu số = có sẵn 1 + dễ trả 3 = **4** · **Đáng = -2.50** → không đáng\n\n**Áp lực**\n\n| Cặp | nêu cái giá | xử được không |\n|---|---|---|\n| mất gì | 1 | 1 |\n| sợ gì | 2 | 1 |\n| cái sợ đó khi nào tới | 3 | 1 |\n\nTử số = **6** · Mẫu số = **3** · **Áp lực = 2.00** → rất áp lực\n\n→ **Ô 7 — Trả về đúng chủ**\n\n\n### thủ tục giấy tờ đang treo của mình\n\n*Cảnh:* Giấy tờ mãi chưa xong  \n*Câu nhịp 2:* Bực mình vì cái giấy tờ mãi chưa xong\n\n**Đáng**\n\n| Ô | cái gì | mấy phần | bao lâu | cộng | dấu |\n|---|---|---|---|---|---|\n| A — thiếu → chết | 1 | 1 | 1 | **3** | + |\n| B — thiếu → sống | 0 | 0 | 0 | **0** | − |\n| C — có → sống | 1 | 1 | 0 | **2** | + |\n| D — có → chết | 0 | 0 | 0 | **0** | − |\n\nTử số = (3 + 2) − (0 + 0) = **5** · Mẫu số = có sẵn 1 + dễ trả 2 = **3** · **Đáng = 1.67** → đáng\n\n**Áp lực**\n\n| Cặp | nêu cái giá | xử được không |\n|---|---|---|\n| mất gì | 2 | 2 |\n| sợ gì | 2 | 2 |\n| cái sợ đó khi nào tới | 3 | 2 |\n\nTử số = **7** · Mẫu số = **6** · **Áp lực = 1.17** → áp lực\n\n→ **Ô 5 — Gom một mẻ**\n\n\n### dự án đang làm của mình\n\n*Cảnh:* Dự án đang cháy  \n*Câu nhịp 2:* Sợ rằng dự án đổ thì cả năm công cốc\n\n**Đáng**\n\n| Ô | cái gì | mấy phần | bao lâu | cộng | dấu |\n|---|---|---|---|---|---|\n| A — thiếu → chết | 3 | 3 | 2 | **8** | + |\n| B — thiếu → sống | 0 | 0 | 0 | **0** | − |\n| C — có → sống | 3 | 2 | 2 | **7** | + |\n| D — có → chết | 0 | 1 | 1 | **2** | − |\n\nTử số = (8 + 7) − (0 + 2) = **13** · Mẫu số = có sẵn 1 + dễ trả 2 = **3** · **Đáng = 4.33** → rất đáng\n\n**Áp lực**\n\n| Cặp | nêu cái giá | xử được không |\n|---|---|---|\n| mất gì | 3 | 2 |\n| sợ gì | 3 | 2 |\n| cái sợ đó khi nào tới | 3 | 2 |\n\nTử số = **9** · Mẫu số = **6** · **Áp lực = 1.50** → rất áp lực\n\n→ **Ô 1 — Đóng cửa tập trung**\n\n\n---\n\n## 3. Mấy cặp đáng đối chiếu\n\n\n**Thật vs giả — cùng khuôn 'bực với bản thân'**\n\n| Đối tượng | Của ai | Đáng | Áp lực | Ô |\n|---|---|---|---|---|\n| cách có mặt với con | của mình | 5.33 | 1.17 | 2 |\n| hình ảnh của mình trong mắt họ hàng | của mình | -2.33 | 0.83 | 8 |\n\nCùng một khuôn câu, cùng vế sở hữu là mình, mà ra hai đầu bảng. Ô D làm việc: kỳ vọng họ hàng thì càng chiều càng chết.\n\n**Quan hệ còn sống vs đã nguội**\n\n| Đối tượng | Của ai | Đáng | Áp lực | Ô |\n|---|---|---|---|---|\n| quan hệ vợ chồng — còn yêu | của mình | 8.50 | 0.17 | 3 |\n| quan hệ vợ chồng — hết yêu | của mình | 0.33 | 1.20 | 8 |\n\nVế MẤT y hệt nhau — thiếu thì chết một mảng lớn. Cái tách hai bên ra là vế ĐƯỢC và ô D. Thước chỉ hỏi 'mất gì' thì hai cuộc hôn nhân này chấm giống hệt nhau.\n\n**Nuôi sống rẻ vs quý mà đắt**\n\n| Đối tượng | Của ai | Đáng | Áp lực | Ô |\n|---|---|---|---|---|\n| vệ sinh cá nhân | của mình | 7.00 | 0.00 | 3 |\n| việc nuôi con | của mình | 4.00 | 1.00 | 2 |\n\nThứ nuôi mình sống mà rẻ thì đáng nhất, chứ không phải thứ mình quý nhất. Ai cũng quý con hơn không khí — mà thử một phút không có không khí xem.\n\n**Nghiện đội lốt chính đáng**\n\n| Đối tượng | Của ai | Đáng | Áp lực | Ô |\n|---|---|---|---|---|\n| cách cập nhật tin tức | của mình | -2.50 | 0.56 | 9 |\n| cách chia rủi ro | của người đó | 3.00 | 0.17 | 6 |\n\nCâu 'lo rằng không đọc tin thì tụt hậu' nghe rất chính đáng, mà chấm ra âm. Ô D bắt được.\n\n**So đo vs bài học — cùng nhìn người khác**\n\n| Đối tượng | Của ai | Đáng | Áp lực | Ô |\n|---|---|---|---|---|\n| tốc độ đi lên | của mình | 0.75 | 1.00 | 8 |\n| cách chia rủi ro | của người đó | 3.00 | 0.17 | 6 |\n\nCùng là chuyện người khác. So đo thì kéo về bảng TRONG và ra âm; bài học thì ở bảng NGOÀI và ra dương.\n\n---\n\n## 4. Độ vững — lệch một điểm thì ô có đổi không\n\nKiểm trên mười hai ca dễ nhầm nhất: đổi đúng một câu đi một điểm, xem ô có nhảy không.\n\n| Ca | Ô | Tỷ lệ lệch 1 điểm làm đổi ô |\n|---|---|---|\n| Nghiện ngụy trang thành đáng | 9 | 0% |\n| Trách nhiệm thật | 2 | 0% |\n| Tội lỗi giả | 8 | 8% |\n| Việc của người khác mà mình gánh | 7 | 16% |\n| Học mãi không làm | 9 | 0% |\n| Sở thích thật | 6 | 0% |\n| So đo đội lốt động lực | 8 | 0% |\n| Lo cho con — có thật | 1 | 28% |\n| Việc đáng mà đang cháy | 1 | 27% |\n| Thói quen tốt đã thành nếp | 3 | 0% |\n| Kỳ vọng ngầm đội lốt nguyên tắc | 8 | 0% |\n| Việc nhỏ mà chặn đường | 5 | 41% |\n\n**Tổng: 38/371 = 10%** số cách lệch một điểm làm đổi ô.\n\nBảy trên mười hai ca vững tuyệt đối, và cả năm ca *ngụy trang* đều nằm trong nhóm này — khung không chỉ bắt đúng, mà bắt chắc tay. Ba ca chông chênh 16–28% đều có áp lực rơi đúng mốc 1,50. Ca chông chênh nhất (41%) chông chênh cả hai trục, đáng 1,67 và áp lực 1,17, đều sát mốc — món tầm thường lửng lơ thì xếp ô nào cũng gần đúng, mà cũng gần sai.\n\nĐọc chung: khung vững ở chỗ cần vững — chỗ phân biệt thật với giả — và lỏng ở chỗ hai ô cạnh nhau vốn xử gần giống nhau. Nhầm ô 1 với ô 2 thì hại ít.\n\n\n---\n\n## 5. Những chỗ khung đã từng gãy\n\nKhung hiện hành không sinh ra một lần. Nó qua mấy vòng chấm thử, mỗi vòng gãy một chỗ, sửa xong chạy lại. Ghi lại đây vì chính những chỗ gãy mới nói rõ khung nghĩ gì.\n\n\n### Gãy 1 — 'không sửa được' đứng nhầm chỗ nguồn\n\nThước Đáng bản đầu có câu *hỏng thì sửa lại được không*, chấm điểm cao cho thứ không sửa được. Nhưng đập vỡ cái ly cũng không sửa được. Không-sửa-được là hệ số rủi ro, nó nhân lên cái vốn đã đáng chứ tự nó không sinh ra đáng. **Sửa:** đi từ ý nghĩa — *thiếu nó thì cái gì trong mình chết* — bỏ hẳn câu sửa-được-không.\n\n\n### Gãy 2 — chỉ hỏi vế mất thì bỏ lọt cả một loại\n\nThước chỉ hỏi *thiếu thì cái gì chết* bắt được thứ phòng thủ, còn thứ thiếu chẳng chết gì mà có thì bừng lên — học đàn, đi du lịch — bị chấm 0, rơi xuống chung với lướt điện thoại. **Sửa:** thêm vế *có nó thì cái gì sống.* Rồi thử lấy vế cao hơn hay cộng hai vế — cặp người yêu / vợ còn yêu phân định: cộng mới đúng, vì món ăn cả hai vế thì đáng hơn thật (vợ còn yêu 4,25 trên người yêu 4,00; vợ hết yêu tụt xuống 3,00 vì vế được rụng).\n\n\n### Gãy 3 — rượu chấm ngang đi biển\n\nVới hai vế thiếu-chết và có-sống, rượu thuốc lá chấm 1,00 và đi biển 1,20 — sát nhau, vì cả hai đều 'thiếu chẳng chết gì, có thì được chút gì'. Thước không thấy được cái khác biệt duy nhất đáng kể: một bên đang giết mình. **Sửa:** đủ bốn ô — thêm *thiếu thì cái gì sống* (trừ) và *có thì cái gì chết* (trừ). Rượu rơi xuống −6,00, đi du lịch vẫn 2,00.\n\n\n### Gãy 4 — 'vui' thua 'sống'\n\nVế dương ban đầu dùng chữ *vui*. Thuốc huyết áp có thì chẳng vui gì nên chấm 0 ở vế ấy, dù nó giữ mình sống. Và việc tốt mà cực bị phạt oan, vì 'bỏ tập thì vui' chấm nặng. **Sửa:** đổi sang *sống* — thuốc huyết áp lên 5,50, tập thể dục từ 2,75 lên 3,25, và bốn ô cân về sức nặng vì cùng một trục chết–sống.\n\n\n### Gãy 5 — con nhỏ rơi vào ô 6\n\nMẫu số Đáng bản đầu đo *chỗ nó chiếm trong đầu* (chiếm bao lâu, có tự đóng không). Con nhỏ chấm mẫu 8 vì ngốn hết chỗ, chia ra còn 2,25 — đáng thấp, ô 6, kho để dành. Vô lý. Cái nghề cũng rơi ô 6. **Sửa:** mẫu số đo *cái phải bỏ ra để có* — có sẵn chưa, dễ trả không theo nguồn lực mình có. Con nhỏ lên 3,75, cái nghề lên 4,67.\n\n\n### Gãy 6 — vệ sinh cá nhân đứng trên con cái\n\nVới mẫu số mới, vệ sinh cá nhân chấm 7,00, trên con cái 3,75. Người viết báo là gãy. Người thiết kế bác: đúng rồi, thêm không khí và nước vào xem — thiếu bốn phút là chết, mà không tốn một phần chỗ nào. **Không sửa.** Ghi thành câu trong sách: thứ nuôi mình sống mà rẻ thì đáng nhất, chứ không phải thứ mình quý nhất. Đây là lần khung đúng mà người chấm sai.\n\n\n### Gãy 7 — 'khi nào' hỏi hạn của việc\n\nCặp thứ ba của thước Áp lực hỏi *khi nào* — ban đầu hiểu là hạn của việc. Cái ấm ức không có hạn nào nên chấm 0, trong khi chính sách khẳng định ấm ức ép suốt mười năm. Công thức tự mâu thuẫn với luận điểm. **Sửa:** hỏi *cái sợ vừa nêu ập tới lúc nào* — ấm ức thì cái sợ đang diễn ra, chấm 3. Ba câu thành một chuỗi liền: mất gì → sợ gì → cái sợ ấy khi nào tới.\n\n\n### Gãy 8 — mẫu số Áp lực chấm rời\n\nBa câu 'xử được không' ban đầu hỏi chung chung, rời khỏi tử số. Người có thể bù được tiền mà bó tay với chuyện mất mặt — chấm rời thì bị bình quân thành một điểm, mất sạch chỉ dẫn. **Sửa:** cắm từng câu mẫu vào từng câu tử, thành ba cặp. Cặp nào lệch nhất — trái cao, phải thấp — chính là chỗ phải nhắm khi hạ áp.\n\n\n### Gãy 9 — định nghĩa 'xử được' \n\nCó lúc sách định nghĩa 'xử được' là chặn không cho tới, hay chịu được khi tới, và dặn giữ nhất quán. Người thiết kế gạt: đừng định nghĩa, một tỷ cách hiểu cũng được, kể cả cách sai — ai tự tin nhầm thì chấm cao, và đúng là họ không thấy ép thật. **Sửa:** chỉ hỏi đúng câu đó. Thước đo cái ép mình đang chịu, không đo mình đúng hay sai.\n\n\n### Gãy 10 — bóc ra 'chị Loan'\n\nBước nhận diện ban đầu bảo tìm *nhân vật chính*, và bóc ra người trong cảnh. Nhưng chị Loan không chấm được, xử xong cảnh vẫn chạy lại. **Sửa:** cảm xúc bám vào *điều cảnh nói lên*, và điều ấy là một đối tượng dạng *[cái gì] của [ai]* — cách tiêu tiền của chị Loan, chứ không phải chị Loan. Rồi phát hiện thêm: ví dụ chị Hà bóc ra 'chỗ đứng trong nghề' cũng sai — trèo lên một bậc trừu tượng; đọc thẳng từ câu nhịp 2 thì là 'hình ảnh của mình trong mắt đồng nghiệp', và việc phải làm đổi hẳn.\n\n\n### Gãy 11 — đối tượng đứng trơ\n\nKhi nhận diện hỏi *cảnh nói lên điều gì*, có lúc bóc ra 'tiền', 'bản thân', 'gia đình' — cái nào chấm cũng ra đáng, vô nghĩa. **Sửa:** đối tượng bắt buộc có vế sở hữu. Và nối được với luật chấm: đối tượng đứng trơ chính là cái *thô* ghi lúc yên, vào việc mới mổ ra thành cách tiêu tiền, lời hứa của bản thân, bữa cơm chung của nhà mình.\n\n\n### Không gãy — ba chỗ báo nhầm\n\nVòng chạy mười cảnh trừu tượng, người viết báo ba chỗ gãy: ô 4 nhận 'cái mình lấy làm chỗ dựa' (cách xử 'làm đủ rồi thôi' nghe vô lý), ô 6 nuốt bốn món sâu nhất, ô 7 nhận 'mấy năm đã qua' (trả về cho ai?). Người thiết kế xem lại từng cái: ô 4 là *nghĩ* đủ rồi thôi, ba mươi phút ba lần mà vẫn mơ hồ thì xóa là đúng, để nó réo thì còn làm được gì; ô 6 có cơ chế loại, món đáng thì kéo lên chứ không mất; ô 7 thì trả về cho mình-của-quá-khứ, và trả xong nó ra vòng ngoài. Cả ba chạy đúng. Chỗ thật sự cần chỉnh chỉ là mốc đếm ba lần cho món bảng NGOÀI — đếm từ lúc đã soi ra đối tượng, không phải từ lúc mới ghi.\n\n\n---\n\n*— Hết cuốn Thử —*"};

const mem={};
const store={
  async get(k){
    try{ if(window.storage&&window.storage.get){const r=await window.storage.get(k); if(r&&r.value!=null) return JSON.parse(r.value);} }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!=null) return JSON.parse(v);}catch(e){}
    return mem[k]==null?null:mem[k];
  },
  async set(k,v){
    const s=JSON.stringify(v); mem[k]=v;
    try{ if(window.storage&&window.storage.set){await window.storage.set(k,s);} }catch(e){}
    try{ localStorage.setItem(k,s);}catch(e){}
  }
};

function bindBreath(kind){
  const t0=Date.now();
  const tick=()=>{
    const s=Math.floor((Date.now()-t0)/1000);
    const left=22-s;
    const c=$('#count'),ph=$('#phase');
    if(!c) return;
    c.textContent=left>0?left:'';
    if(s>=11&&ph.textContent!=='Sẵn sàng') ph.textContent='Sẵn sàng';
    if(left<=0){go('#q3/'+kind);return;}
    breathTimer=setTimeout(tick,250);
  };
  breathTimer=setTimeout(tick,250);
  $('#skip').onclick=()=>{breathState.skipped=true;go('#q3/'+kind);};
}

function bindLamro(id){

    res.innerHTML=`<div class="o">Ô ${o}</div><div class="n">${ONAME[o]}</div><div class="sm">${d.full?'Đáng '+dv.toFixed(2):dangMuc(dval)} · ${ap.full?'Áp lực '+av.toFixed(2):apMuc(aval)}</div><div class="sm mu" style="margin-top:8px">${OXU[o]}</div>`;

function csvOut(){
  const H=['id','ts','kind','place','body','answer','text','skipped','manual','n1','hot','n2','dt1','dt2','doituong','ngoai','dmuc','amuc','A','B','C','D','g1','g2','apt','apm','o','tries'];
  const esc2=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=S.entries.map(e=>{const r=e.r||{},d=r.dang||{},a=r.ap||{};
    return [e.id,e.ts,e.kind,e.place,(e.body||[]).join('|'),e.answer,e.text,e.skipped?1:0,e.manual?1:0,r.n1,r.hot,r.n2,r.dt1,r.dt2,e.doituong,e.ngoai?1:0,r.dmuc,r.amuc,(d.A||[]).join('|'),(d.B||[]).join('|'),(d.C||[]).join('|'),(d.D||[]).join('|'),d.g1,d.g2,(a.t||[]).join('|'),(a.m||[]).join('|'),e.o,JSON.stringify(e.tries||[])].map(esc2).join(',');});
  return '\ufeff'+H.join(',')+'\n'+rows.join('\n');
}
function csvParse(txt){
  const rows=[];let cur=[],f='',inq=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(inq){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else inq=false;}else f+=c;}
    else{if(c==='"')inq=true;else if(c===','){cur.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;cur.push(f);rows.push(cur);cur=[];f='';}else f+=c;}}
  if(f||cur.length){cur.push(f);rows.push(cur);}
  return rows.filter(r=>r.length>1);
}
function bindRaTuan(){
  $('#saveChon').onclick=async()=>{S.chonba=[...document.querySelectorAll('[data-chon]')].map(x=>x.value.trim());await save();toast('Đã lưu');};
  $('#exportCsv').onclick=()=>{const b=new Blob([csvOut()],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='khong-gian-trong-dau-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);};
  $('#importCsv').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const txt=(await f.text()).replace(/^\ufeff/,'');const rows=csvParse(txt);const H=rows.shift();const ix=n=>H.indexOf(n);
    let added=0,upd=0;
    rows.forEach(r=>{const g=n=>r[ix(n)]||'';const id=g('id');if(!id)return;
      const spl=s=>s?s.split('|').map(Number):null;
      const e={id,ts:g('ts'),kind:g('kind'),place:g('place'),body:g('body')?g('body').split('|'):[],answer:g('answer'),text:g('text'),skipped:g('skipped')==='1',manual:g('manual')==='1',
        doituong:g('doituong'),ngoai:g('ngoai')==='1',o:g('o')?+g('o'):null,tries:(()=>{try{return JSON.parse(g('tries')||'[]')}catch(x){return[]}})(),
        r:{n1:g('n1'),hot:g('hot'),n2:g('n2'),dt1:g('dt1'),dt2:g('dt2'),dmuc:g('dmuc')||null,amuc:g('amuc')||null,
           dang:{A:spl(g('A'))||[0,0,0],B:spl(g('B'))||[0,0,0],C:spl(g('C'))||[0,0,0],D:spl(g('D'))||[0,0,0],g1:+g('g1')||1,g2:+g('g2')||1,full:!!g('A')&&g('A')!=='0|0|0'},
           ap:{t:spl(g('apt'))||[0,0,0],m:spl(g('apm'))||[1,1,1],full:!!g('apt')&&g('apt')!=='0|0|0'}}};
      const i=S.entries.findIndex(x=>x.id===id);if(i>=0){S.entries[i]=e;upd++;}else{S.entries.push(e);added++;}});
    await save();toast(`Nạp ${added} mới, cập nhật ${upd}`);render();};
  $('#wipe').onclick=async()=>{if(confirm('Xóa hết? Không lấy lại được.')&&confirm('Chắc chứ?')){S.entries=[];S.chonba=[];await save();render();}};
}

/* ================= SÁCH ================= */
const BOOK_ORDER=['thay','dung','cham','cam','thu'];
const BOOK_NAME={thay:'Thấy',dung:'Dùng',cham:'Chấm',cam:'Cảm',thu:'Thử'};
function md(src,bid){
  const lines=src.split('\n');let out=[],i=0,blocks=0;
  const inl=s=>{s=esc(s);s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');return s;};
  const id=()=>`b-${bid}-${blocks++}`;
  while(i<lines.length){
    const L=lines[i];const t=L.trim();
    if(!t){i++;continue;}
    if(t==='---'){out.push('<hr>');i++;continue;}
    let m;
    if((m=t.match(/^(#{1,4})\s+(.*)$/))){const n=m[1].length;out.push(`<h${n} id="${id()}">${inl(m[2])}</h${n}>`);i++;continue;}
    if(t.startsWith('>')){const q=[];while(i<lines.length&&lines[i].trim().startsWith('>')){q.push(lines[i].trim().replace(/^>\s?/,''));i++;}out.push(`<blockquote>${q.map(x=>`<p>${inl(x)}</p>`).join('')}</blockquote>`);continue;}
    if(t.startsWith('|')){const rows=[];while(i<lines.length&&lines[i].trim().startsWith('|')){const r=lines[i].trim();if(!/^\|[\s\-:|]+\|$/.test(r))rows.push(r.replace(/^\||\|$/g,'').split('|').map(x=>x.trim()));i++;}
      if(rows.length){out.push('<table>'+rows.map((r,ri)=>'<tr>'+r.map(c=>ri===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>');}continue;}
    if(/^(\d+\.|[-•])\s/.test(t)){const ol=/^\d/.test(t);const items=[];while(i<lines.length&&/^\s*(\d+\.|[-•])\s/.test(lines[i])){items.push(lines[i].trim().replace(/^(\d+\.|[-•])\s+/,''));i++;}
      out.push(`<${ol?'ol':'ul'}>${items.map(x=>`<li>${inl(x)}</li>`).join('')}</${ol?'ol':'ul'}>`);continue;}
    if(/^(📌|💡|⚠️)/.test(t)){const cls=t.startsWith('📌')?'ghi':t.startsWith('💡')?'meo':'coi';out.push(`<div class="callout ${cls}" id="${id()}">${inl(t.replace(/^(📌|💡|⚠️)\s*/,''))}</div>`);i++;continue;}
    const para=[];while(i<lines.length&&lines[i].trim()&&!/^(#|>|\||---|\d+\.\s|[-•]\s|📌|💡|⚠️)/.test(lines[i].trim())){para.push(lines[i].trim());i++;}
    out.push(`<p id="${id()}">${inl(para.join(' '))}</p>`);
  }
  return out.join('\n');
}
function vSach(bid,q){
  bid=BOOK_ORDER.includes(bid)?bid:null;
  const tabs=`<div class="booktabs"><button class="${!bid?'on':''}" data-go="#sach">Tìm</button>${BOOK_ORDER.map(b=>`<button class="${bid===b?'on':''}" data-go="#sach/${b}">${BOOK_NAME[b]}</button>`).join('')}</div>`;
  if(!bid){
    return `<h1>Sách</h1>${tabs}
<input type="text" id="search" placeholder="Tìm trong cả năm cuốn…" value="${esc(q?decodeURIComponent(q):'')}">
<div id="hits" style="margin-top:12px"></div>
<p class="mu sm" style="margin-top:20px"><b>Thấy</b> — đọc một mạch, vì sao và hai cái thước. <b>Dùng</b> — sổ tay chạy hằng ngày. <b>Chấm</b> — chấm kỹ bằng điểm số. <b>Cảm</b> — một truyện, không nhắc một chữ nào của hệ. <b>Thử</b> — bảy mươi ca đã chấm.</p>`;
  }
  const src=BOOKS[bid];
  const toc=[];src.split('\n').forEach((L,i)=>{const m=L.match(/^(##|###)\s+(.*)$/);if(m)toc.push([m[1].length,m[2]]);});
  let bi=0;const html=md(src,bid);
  const heads=[...html.matchAll(/<h(2|3) id="([^"]+)">(.*?)<\/h\1>/g)].map(m=>({n:+m[1],id:m[2],t:m[3].replace(/<[^>]+>/g,'')}));
  return `${tabs}<div class="toc">${heads.map(h=>`<a href="#sach/${bid}" data-jump="${h.id}" class="${h.n===3?'sub':''}">${h.t}</a>`).join('')}</div><div class="book">${html}</div>`;
}
function bindSach(bid){
  if(!bid){const inp=$('#search');const run=()=>{const qq=inp.value.trim().toLowerCase();const box=$('#hits');if(qq.length<2){box.innerHTML='';return;}
      const hits=[];BOOK_ORDER.forEach(b=>{const paras=BOOKS[b].split(/\n\s*\n/);paras.forEach((p,pi)=>{if(p.toLowerCase().includes(qq)){hits.push([b,p.split('\n').filter(l=>!/^\|[\s\-:|]+\|$/.test(l.trim())).join(' ').replace(/[#>*|]/g,' ').replace(/\s+/g,' ').trim().slice(0,200),pi]);}});});
      box.innerHTML=hits.length?hits.slice(0,40).map(h=>`<a class="hit" href="#sach/${h[0]}" data-find="${esc(qq)}"><small>${BOOK_NAME[h[0]]}</small>${esc(h[1]).replace(new RegExp(qq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`)}</a>`).join(''):`<p class="mu sm">Không thấy.</p>`;};
    inp.oninput=run;run();inp.focus();
    $('#hits').onclick=e=>{const a=e.target.closest('[data-find]');if(a)window.__find=a.dataset.find;};
  } else {
    document.querySelectorAll('[data-jump]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const el=document.getElementById(a.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
    if(window.__find){const qq=window.__find;window.__find=null;const els=[...document.querySelectorAll('.book p,.book li,.book td,.book blockquote,.book h2,.book h3,.book .callout')];const el=els.find(x=>x.textContent.toLowerCase().includes(qq));if(el){setTimeout(()=>el.scrollIntoView({block:'center'}),50);el.style.background='#33301F';}}
  }
}

/* ================= bind ================= */
function bind(p,a,b){
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
  if(p==='breath')bindBreath(a);
  else if(p==='q3')bindQ3(a);
  else if(p==='list')bindList();
  else if(p==='lamro')bindLamro(a);
  else if(p==='ratuan')bindRaTuan();
  else if(p==='sach')bindSach(a);
  else if(p==='checkin'||!p){setInterval(()=>{const c=$('#clock');if(c)c.textContent=fmtTime(new Date());},15000);}
}
